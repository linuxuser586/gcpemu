# API definitions the emulator's route tables and field-behaviour
# validation are generated from (NFR-MNT-001). After changing this file,
# or bumping google.golang.org/api in go.mod, run `task generate`;
# `task generate GOOGLEAPIS=latest` first moves the googleapis pin to the
# head of master.
googleapis:
  # googleapis/googleapis commit the .proto files are read from.
  commit: 3d42ca0ca56658a8ddae0571ebbe99faf044a440
  files:
    - google/cloud/certificatemanager/v1/certificate_manager.proto
    - google/cloud/location/locations.proto
    - google/cloud/networksecurity/v1/network_security.proto
    - google/cloud/secretmanager/v1/service.proto
    - google/container/v1/cluster_service.proto
    - google/devtools/cloudbuild/v1/cloudbuild.proto
    - google/devtools/artifactregistry/v1/service.proto
    - google/iam/credentials/v1/iamcredentials.proto
    - google/iam/v1/iam_policy.proto
    - google/longrunning/operations.proto
    - google/monitoring/v3/metric_service.proto
    - google/pubsub/v1/pubsub.proto
    - google/pubsub/v1/schema.proto
  # Field behaviours the real APIs don't enforce, dropped from the generated
  # tables (message.field: [behaviour, ...]); each entry says why.
  relax:
    # Clients update labels, taints or locations alone (the Go client,
    # OpenTofu's node pool updates); GKE accepts that.
    google.container.v1.UpdateNodePoolRequest.node_version: [REQUIRED]
    google.container.v1.UpdateNodePoolRequest.image_type: [REQUIRED]
    # TimeSeriesView has no UNSPECIFIED value: its zero is FULL, which is
    # what a request that omits view (the REST examples, curl) asks for.
    google.monitoring.v3.ListTimeSeriesRequest.view: [REQUIRED]
    # Cloud Build's regional paths (projects/*/locations/*/builds) name
    # the project in parent or name instead; gcloud --region sends no
    # project_id or id, and the API accepts that.
    google.devtools.cloudbuild.v1.CreateBuildRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.GetBuildRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.GetBuildRequest.id: [REQUIRED]
    google.devtools.cloudbuild.v1.ListBuildsRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.CancelBuildRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.CancelBuildRequest.id: [REQUIRED]
    google.devtools.cloudbuild.v1.RetryBuildRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.RetryBuildRequest.id: [REQUIRED]
    # The same holds for Build triggers: their regional paths
    # (projects/*/locations/*/triggers), which OpenTofu uses, name the
    # project and trigger in parent or name, and a regional patch in
    # trigger.resource_name.
    google.devtools.cloudbuild.v1.CreateBuildTriggerRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.GetBuildTriggerRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.GetBuildTriggerRequest.trigger_id: [REQUIRED]
    google.devtools.cloudbuild.v1.ListBuildTriggersRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.DeleteBuildTriggerRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.DeleteBuildTriggerRequest.trigger_id: [REQUIRED]
    google.devtools.cloudbuild.v1.UpdateBuildTriggerRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.UpdateBuildTriggerRequest.trigger_id: [REQUIRED]
    google.devtools.cloudbuild.v1.RunBuildTriggerRequest.project_id: [REQUIRED]
    google.devtools.cloudbuild.v1.RunBuildTriggerRequest.trigger_id: [REQUIRED]
    # A run's source names only the revision of the trigger's own
    # repository (gcloud builds triggers run --branch), with no repo_name.
    google.devtools.cloudbuild.v1.RepoSource.repo_name: [REQUIRED]
    # OpenTofu's worker_config.no_external_ip sends networkConfig with an
    # egressOption alone, for a pool on no peered network.
    google.devtools.cloudbuild.v1.PrivatePoolV1Config.NetworkConfig.peered_network: [REQUIRED]

# Discovery documents, read from the google.golang.org/api module version
# pinned in go.mod (each revision is recorded in zz_discovery.go).
discovery:
  - api: compute
    version: v1
    # annotations.required entries the real API doesn't enforce
    # (Schema.property: [method, ...]); each entry says why.
    relax:
      # A patch names the firewall in its path; clients send only the
      # changed fields.
      Firewall.name: [compute.firewalls.patch]
      # Documented as defaulting to 1000 when omitted.
      Route.priority: [compute.routes.insert]
      # The deprecated top-level form; OpenTofu names the peering in
      # networkPeering.name instead.
      NetworksAddPeeringRequest.name: [compute.networks.addPeering]
  - {api: dns, version: v1}
  - {api: iam, version: v1}
  - {api: sqladmin, version: v1beta4}
  - {api: storage, version: v1}
