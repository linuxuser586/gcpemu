openapi: 3.0.3
info:
  title: gcpemu admin API
  version: v1
  description: |
    The emulator's own control interface (SRS 7.3, FR-CORE-045), served on
    the gateway port under /_emu/v1/. It is the only interface not modelled
    on a Google API. It is unauthenticated and not request-logged; bind the
    gateway to loopback (the default) to keep it private.

    Errors are `{"error": "message"}` unless noted; endpoints provided by a
    service module (cdn, ca) return Google's JSON error envelope.
servers:
  - url: http://127.0.0.1:4510
paths:
  /_emu/v1/openapi.yaml:
    get:
      summary: This document (also printed by `gcpemu admin openapi`).
      operationId: openapi
      responses:
        "200":
          description: OpenAPI 3 document.
          content:
            application/yaml:
              schema:
                type: string
  /_emu/v1/health:
    get:
      summary: Liveness of the gateway.
      operationId: health
      responses:
        "200":
          description: The emulator is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /_emu/v1/ready:
    get:
      summary: Readiness per service (NFR-REL-003).
      operationId: ready
      responses:
        "200":
          description: Every enabled service is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one service is not ready; its reason is given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /_emu/v1/info:
    get:
      summary: Instance identity, configuration summary and endpoints.
      operationId: info
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /_emu/v1/endpoints:
    get:
      summary: Listener addresses by endpoint name (as in endpoints.json).
      operationId: endpoints
      responses:
        "200":
          description: Endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endpoints" }
  /_emu/v1/env:
    get:
      summary: Environment variables clients need (`gcpemu env`).
      operationId: env
      parameters:
        - name: trust
          in: query
          description: >-
            With true, write a bundle of the system roots plus the emulator CA
            and point SSL_CERT_FILE at it.
          schema: { type: boolean }
      responses:
        "200":
          description: Variable name to value.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/hostmode:
    get:
      summary: Host mode state (FR-CORE-043).
      operationId: hostMode
      responses:
        "200":
          description: Host mode status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  state: { type: string }
                  error: { type: string }
                  ip: { type: string, description: "Frontend container address (HTTPS :443, HTTP :80, DNS :53)." }
                  interface: { type: string, description: Host bridge interface the IP is reached through. }
                  domains:
                    type: array
                    items: { type: string }
                  hosts:
                    type: array
                    items: { type: string }
                  caFile: { type: string }
  /_emu/v1/containers:
    get:
      summary: Containers the instance created (GKE nodes, Cloud SQL, NAT, ...).
      operationId: containers
      responses:
        "200":
          description: Containers, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/seed:
    post:
      summary: Apply a seed file idempotently (FR-CORE-011).
      operationId: seed
      parameters:
        - name: path
          in: query
          required: true
          description: Seed file path on the emulator host.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
  /_emu/v1/events:
    get:
      summary: Server-sent stream of resource changes, Operation progress and Request log entries (FR-UI-006).
      operationId: events
      description: |
        A `text/event-stream` that stays open. Each event has an `id`, an
        `event` type and one line of JSON `data`:

        - `resource`: a ResourceChange, sent when a control-plane store key
          is written or deleted.
        - `operation`: an OperationChange, sent when an Operation of any
          Service (including Cloud DNS changes) is created, progresses,
          completes or is deleted.
        - `request`: a RequestEntry, sent for every Request log entry.
        - `reset`: `{}`; all state was replaced (`gcpemu reset`). Refetch
          everything.
        - `gap`: `{}`; only sent first on a resumed stream whose missed
          events are no longer retained or whose ID belongs to another
          process. Refetch everything.

        Events are numbered per process. To resume, reconnect with the last
        `id` in `Last-Event-ID` (EventSource does this itself): missed
        events are replayed, or `gap` is sent. Idle streams carry a comment
        every 15 s. The server ends a stream whose client falls too far
        behind, and at shutdown; the `retry` field asks clients to
        reconnect after 1 s.
      parameters:
        - name: Last-Event-ID
          in: header
          description: ID of the last event received, to resume after it.
          schema: { type: string }
        - name: lastEventId
          in: query
          description: As Last-Event-ID, for clients that cannot set headers.
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 1000

                id: lx2k9q1c-7
                event: resource
                data: {"service":"gcs","namespace":"gcs/buckets","key":"my-bucket"}

                id: lx2k9q1c-8
                event: request
                data: {"time":"2026-10-08T12:00:00Z","service":"gcs","protocol":"http","method":"POST /storage/v1/b","status":200,"latencyMs":1.2}
  /_emu/v1/requests:
    get:
      summary: Recent request log entries, oldest first (FR-CORE-061).
      operationId: requests
      parameters:
        - name: service
          in: query
          description: Only entries of this service.
          schema: { type: string }
      responses:
        "200":
          description: Request log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/RequestEntry" }
  /_emu/v1/resources:
    get:
      summary: Dump of the control-plane store.
      operationId: resources
      parameters:
        - name: namespace
          in: query
          description: Only this store namespace (e.g. "compute/natsink").
          schema: { type: string }
      responses:
        "200":
          description: Namespace to key to stored value (JSON, or a string for non-JSON values).
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: {}
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/resources/counts:
    get:
      summary: Number of resources of each type, per service (Web console dashboard).
      operationId: resourceCounts
      description: >-
        Keys are service IDs and user-facing resource types named like the
        API's collections ("buckets", "subscriptions"), not store namespaces.
        Services that hold no resources of their own (cdn, nat) are absent.
      responses:
        "200":
          description: Service ID to resource type to count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceCounts" }
  /_emu/v1/operations:
    get:
      summary: Every Operation of every service (Web console Operations view, FR-UI-012).
      operationId: operations
      description: >-
        Operations of every wire format (google.longrunning, Compute, Cloud
        SQL, GKE, Cloud DNS changes) summarised in one shape, newest first.
        Services without Operations are absent. The `operation` events of
        /_emu/v1/events report changes to them.
      parameters:
        - name: service
          in: query
          description: Only this Service ID's Operations.
          schema: { type: string }
        - name: project
          in: query
          description: Only this Project's Operations.
          schema: { type: string }
      responses:
        "200":
          description: The Operations.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items: { $ref: "#/components/schemas/Operation" }
  /_emu/v1/reset:
    post:
      summary: Wipe all state, keeping configuration (`gcpemu reset`).
      operationId: reset
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/time/advance:
    post:
      summary: Advance the emulator clock (`gcpemu time advance`, FR-GCS-008).
      operationId: advanceTime
      parameters:
        - name: by
          in: query
          required: true
          description: Non-negative Go duration, e.g. "24h".
          schema: { type: string }
      responses:
        "200":
          description: The new emulator time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/faults:
    get:
      summary: Active fault injection rules (FR-CORE-060).
      operationId: listFaults
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  faults:
                    type: array
                    items: { $ref: "#/components/schemas/FaultRule" }
    post:
      summary: Add a fault injection rule.
      operationId: addFault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaultRule" }
      responses:
        "200":
          description: The added rule with its ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultRule" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove every fault injection rule.
      operationId: clearFaults
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /_emu/v1/faults/{id}:
    delete:
      summary: Remove one fault injection rule.
      operationId: removeFault
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/shutdown:
    post:
      summary: Shut the instance down gracefully (`gcpemu stop`).
      operationId: shutdown
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /_emu/v1/cdn:
    get:
      summary: Cloud CDN cache statistics (cdn service).
      operationId: cdnStats
      responses:
        "200":
          description: Cache usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: integer }
                  bytes: { type: integer }
                  limitBytes: { type: integer }
  /_emu/v1/cdn/purge:
    post:
      summary: Clear the Cloud CDN cache (`gcpemu cdn purge`, FR-CDN-008).
      operationId: cdnPurge
      responses:
        "200":
          description: Number of entries removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: integer }
  /_emu/v1/pubsub/subscriptions:
    get:
      summary: Pub/Sub subscription statistics (pubsub service; Web console Pub/Sub view).
      operationId: pubsubStats
      description: >-
        What GCP reports as Cloud Monitoring metrics of a subscription
        (num_undelivered_messages, oldest_unacked_message_age,
        dead_letter_message_count), which the emulator does not serve.
      parameters:
        - name: project
          in: query
          description: Only this Project's subscriptions.
          schema: { type: string }
      responses:
        "200":
          description: The subscriptions, by name.
          content:
            application/json:
              schema:
                type: object
                required: [now, subscriptions]
                properties:
                  now:
                    type: string
                    format: date-time
                    description: >-
                      The Emulator clock, which publish times follow. Seeking
                      a subscription to it purges every message published so far.
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionStats" }
  /_emu/v1/ca/rotate:
    post:
      summary: Replace the instance CA and re-issue managed certificates (`gcpemu ca rotate`; certs service).
      operationId: caRotate
      responses:
        "200":
          description: The CA was rotated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rotated] }
                  path: { type: string, description: Path of the new ca.pem. }
        "412":
          description: The instance has no CA (Google JSON error envelope).
        "500":
          description: Rotation failed (Google JSON error envelope).
components:
  responses:
    Status:
      description: The operation succeeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
    Error:
      description: The operation failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Info:
      type: object
      required: [instance, id, pid, version, dir, ephemeral, iamMode, strictProjects, console, services, endpoints, runtime]
      properties:
        instance: { type: string }
        id: { type: string }
        pid: { type: integer }
        version: { type: string }
        dir: { type: string, description: Instance data directory. }
        ephemeral: { type: boolean }
        iamMode: { type: string, enum: ["off", audit, enforce] }
        strictProjects:
          type: boolean
          description: Referencing a project that does not exist is an error instead of creating it.
        console: { type: boolean, description: Whether the gateway serves the Web console under /console/. }
        services:
          type: array
          description: Enabled services, in start order.
          items: { type: string }
        endpoints: { $ref: "#/components/schemas/Endpoints" }
        runtime: { $ref: "#/components/schemas/RuntimeStatus" }
    RuntimeStatus:
      type: object
      description: >-
        The container runtime the instance uses, or would use once a service
        needs one. Probed at most every few seconds.
      required: [kind, reachable]
      properties:
        kind: { type: string, enum: [docker, podman, none] }
        version: { type: string }
        reachable: { type: boolean }
        error: { type: string, description: Why the runtime is not reachable. }
    Container:
      type: object
      required: [name, image, state]
      properties:
        name: { type: string }
        service: { type: string }
        resource: { type: string }
        role: { type: string }
        image: { type: string }
        state: { type: string }
    ResourceCounts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: { type: integer }
    Endpoints:
      type: object
      description: Endpoint name ("gateway", "gcs", "lb:FORWARDING_RULE", ...) to host:port.
      additionalProperties: { type: string }
    Readiness:
      type: object
      required: [ready, services]
      properties:
        ready: { type: boolean }
        services:
          type: object
          additionalProperties:
            type: object
            required: [ready]
            properties:
              ready: { type: boolean }
              reason: { type: string }
    Operation:
      type: object
      required: [service, name, done]
      properties:
        service: { type: string, description: Service ID that owns the Operation. }
        name:
          type: string
          description: The Operation's resource name, e.g. "projects/p/global/operations/operation-1".
        project: { type: string }
        location: { type: string, description: '"global", a region, a zone or an API location.' }
        type:
          type: string
          description: What the Operation does, as its API names it ("insert", "CREATE_CLUSTER", "change").
        target: { type: string, description: The resource the Operation acts on or produced. }
        status: { type: string, description: 'The API''s own status ("RUNNING", "pending", "DONE").' }
        done: { type: boolean }
        error:
          type: object
          description: Why the Operation failed.
          required: [message]
          properties:
            code: { type: string, description: 'e.g. "NOT_FOUND", "RESOURCE_ALREADY_EXISTS".' }
            message: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        operation:
          type: object
          additionalProperties: {}
          description: The Operation as the Service's API returns it.
    SubscriptionStats:
      type: object
      required: [name, topic, backlog, backlogBytes, outstanding, deadLettered]
      properties:
        name: { type: string, description: The subscription's resource name. }
        topic: { type: string }
        backlog: { type: integer, description: Unacked messages, leased or not. }
        backlogBytes: { type: integer }
        outstanding: { type: integer, description: Messages leased to a subscriber now. }
        oldestUnackedPublishTime:
          type: string
          format: date-time
          description: Publish time of the oldest unacked message; absent when the backlog is empty.
        deadLettered:
          type: integer
          description: Messages forwarded to the dead-letter topic since the Instance started.
    ResourceChange:
      type: object
      description: Data of a `resource` event.
      required: [service, namespace, key]
      properties:
        service:
          type: string
          description: >-
            The namespace's first segment: a Service ID, or "core" for state
            the emulator owns (Projects in "core/projects").
        namespace: { type: string, description: Store namespace, e.g. "gcs/buckets". }
        key: { type: string, description: Store key within the namespace. }
        deleted: { type: boolean }
    OperationChange:
      type: object
      description: Data of an `operation` event.
      required: [service, namespace, name, done]
      properties:
        service: { type: string, description: Service ID that owns the Operation. }
        namespace: { type: string, description: Store namespace, e.g. "lro/operations". }
        name:
          type: string
          description: >-
            The Operation's name for google.longrunning Operations,
            otherwise its store key (e.g. "P/OP" for Cloud SQL).
        done: { type: boolean }
        deleted: { type: boolean }
    RequestEntry:
      type: object
      properties:
        time: { type: string, format: date-time }
        service: { type: string }
        protocol: { type: string, description: "http, grpc, dns, postgres, tcp, udp" }
        method: { type: string }
        resource: { type: string }
        principal: { type: string }
        status:
          type: integer
          description: >-
            HTTP status, gRPC code or DNS rcode; for connections 0 when admitted and 1 when
            refused.
        code: { type: string }
        latencyMs: { type: number }
    FaultRule:
      type: object
      properties:
        id: { type: string, readOnly: true }
        service: { type: string, description: Emulator service name ("gcs", "pubsub", ...). }
        method:
          type: string
          description: Regexp on the method ("GET /storage/v1/b", "/google.pubsub.v1.Publisher/Publish").
        resource: { type: string, description: Regexp on the request path or resource. }
        code: { type: string, description: Canonical error name to return, e.g. UNAVAILABLE. }
        httpStatus: { type: integer, description: Overrides the HTTP status for code. }
        latency: { type: string, description: Delay added before handling, e.g. "250ms". }
        drop: { type: boolean, description: Close the connection without a response. }
        probability: { type: number, description: "In (0,1]; 0 means always." }
        count: { type: integer, description: How many times the rule fires; 0 means unlimited. }
        fired: { type: integer, readOnly: true }
