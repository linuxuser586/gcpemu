openapi: 3.0.3
info:
  title: gcpemu admin API
  version: v1
  description: |
    The emulator's own control interface (SRS 7.3, FR-CORE-045), served on
    the API gateway port under /_emu/v1/. It is the only interface not modelled
    on a Google API, and it is not request-logged.

    On loopback (the default bind) it needs no credentials. When the API
    gateway is bound beyond loopback, every path except `health` and `ready`
    needs the instance's admin token (FR-UI-009), sent in the
    `X-Gcpemu-Admin-Token` header or in the `gcpemu_admin` cookie that the
    console URL printed at startup sets; without it the answer is 401.
    `gcpemu admin token` prints the token.

    Errors are `{"error": "message"}` unless noted; endpoints provided by a
    service module (cdn, ca) return Google's JSON error envelope.
servers:
  - url: http://127.0.0.1:4510
security:
  - {}
  - adminTokenHeader: []
  - adminTokenCookie: []
paths:
  /_emu/v1/openapi.yaml:
    get:
      summary: This document (also printed by `gcpemu admin openapi`).
      operationId: openapi
      responses:
        "200":
          description: OpenAPI 3 document.
          content:
            application/yaml:
              schema:
                type: string
  /_emu/v1/health:
    get:
      summary: Liveness of the API gateway.
      operationId: health
      security: []
      responses:
        "200":
          description: The emulator is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /_emu/v1/ready:
    get:
      summary: Readiness per service (NFR-REL-003).
      operationId: ready
      security: []
      responses:
        "200":
          description: Every enabled service is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: >-
            At least one service is not ready, or something other than the
            Instance stopped or restarted a Managed container (entry
            "containers", e.g. after the container runtime restarted); the
            reason is given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /_emu/v1/info:
    get:
      summary: Instance identity, configuration summary and endpoints.
      operationId: info
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /_emu/v1/iam/enforcement:
    get:
      summary: The IAM enforcement level now in effect (FR-IAM-004).
      operationId: iamEnforcement
      responses:
        "200":
          description: The enforcement level.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IamEnforcement" }
    put:
      summary: Switch the IAM enforcement level until the Instance stops (Web console IAM view).
      operationId: setIamEnforcement
      description: >-
        Later calls are checked at the new level; `--iam-mode` sets it again
        at the next start. As at startup, `off` is refused while the API gateway
        is bound beyond loopback unless the Instance was started with
        `--i-understand-this-is-insecure`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IamEnforcement" }
      responses:
        "200":
          description: The enforcement level now in effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IamEnforcement" }
        "400": { $ref: "#/components/responses/Error" }
  /_emu/v1/iam/denials:
    get:
      summary: Calls the audit IAM enforcement level would deny, most recently denied first (FR-UI-014).
      operationId: iamDenials
      description: >-
        Every call IAM found the caller lacking a permission for since the
        Instance started or was reset, whether it was allowed (audit) or
        failed (enforce). Calls by one Principal for one permission on one
        resource are one IamDenial. Each carries the smallest predefined
        role granting the permission, the Project whose policy a binding
        of that role belongs in, and whether the Principal now holds the
        permission. The `iamDenial` events of /_emu/v1/events report new
        denied calls.
      parameters:
        - name: project
          in: query
          description: Only denials of resources in this Project.
          schema: { type: string }
      responses:
        "200":
          description: The denials.
          content:
            application/json:
              schema:
                type: object
                required: [denials]
                properties:
                  denials:
                    type: array
                    items: { $ref: "#/components/schemas/IamDenial" }
    delete:
      summary: Forget every IAM denial (Web console IAM audit view).
      operationId: clearIamDenials
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /_emu/v1/endpoints:
    get:
      summary: Listener addresses by endpoint name (as in endpoints.json).
      operationId: endpoints
      responses:
        "200":
          description: Endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endpoints" }
  /_emu/v1/env:
    get:
      summary: Environment variables clients need (`gcpemu env`).
      operationId: env
      parameters:
        - name: trust
          in: query
          description: >-
            With true, write a bundle of the system roots plus the emulator CA
            and point SSL_CERT_FILE at it.
          schema: { type: boolean }
        - name: universe
          in: query
          description: >-
            With false, leave out CLOUDSDK_CORE_UNIVERSE_DOMAIN, so gcloud stays
            in Google's universe.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Variable name to value.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/adc-key:
    post:
      summary: >-
        Write a key file for the host metadata server's service account, for
        `gcpemu env` to point GOOGLE_APPLICATION_CREDENTIALS at when gcloud's
        application-default credentials would otherwise win (ADR 0010). The
        file already written is kept while its key is valid.
      operationId: adcKey
      responses:
        "200":
          description: Where the key file is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/hostmode:
    get:
      summary: Host mode state (FR-CORE-043).
      operationId: hostMode
      responses:
        "200":
          description: Host mode status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  state: { type: string }
                  error: { type: string }
                  ip: { type: string, description: "Host-mode container address (HTTPS :443, HTTP :80, DNS :53)." }
                  interface: { type: string, description: Host bridge interface the IP is reached through. }
                  domains:
                    type: array
                    items: { type: string }
                  hosts:
                    type: array
                    items: { type: string }
                  caFile: { type: string }
  /_emu/v1/containers:
    get:
      summary: Containers the instance created (GKE nodes, Cloud SQL, NAT, ...).
      operationId: containers
      responses:
        "200":
          description: Containers, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/seed:
    get:
      summary: Export the Instance's resources as a seed file (`gcpemu export`, FR-CORE-013).
      operationId: exportSeed
      description: |
        Projects, each Service's resources and the Fault rules, as YAML
        that applying to an empty Instance turns back into the same
        resources. Server-assigned fields and data that lives only in a
        data plane (Postgres rows, Kubernetes objects, Pub/Sub messages)
        are left out.
      responses:
        "200":
          description: The seed file.
          content:
            application/yaml:
              schema: { type: string }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Apply a seed file idempotently (FR-CORE-011).
      operationId: seed
      description: |
        Applies the seed file at `path` on the emulator host, or, without
        `path`, the seed file in the request body (an upload, up to 64 MiB),
        whose relative paths resolve against the instance dir.
      parameters:
        - name: path
          in: query
          description: Seed file path on the emulator host.
          schema: { type: string }
      requestBody:
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
  /_emu/v1/events:
    get:
      summary: Server-sent stream of resource changes, Operation progress, Request log entries and IAM denials (FR-UI-006).
      operationId: events
      description: |
        A `text/event-stream` that stays open. Each event has an `id`, an
        `event` type and one line of JSON `data`:

        - `resource`: a ResourceChange, sent when a control-plane store key
          is written or deleted.
        - `operation`: an OperationChange, sent when an Operation of any
          Service (including Cloud DNS changes) is created, progresses,
          completes or is deleted.
        - `request`: a RequestEntry, sent for every Request log entry.
        - `iamDenial`: an IamDenial without its role, Project and granted
          fields, sent for every call the audit IAM enforcement level
          would deny.
        - `reset`: `{}`; all state was replaced (`gcpemu reset` or a State
          snapshot restore). Refetch everything.
        - `gap`: `{}`; only sent first on a resumed stream whose missed
          events are no longer retained or whose ID belongs to another
          process. Refetch everything.

        Events are numbered per process. To resume, reconnect with the last
        `id` in `Last-Event-ID` (EventSource does this itself): missed
        events are replayed, or `gap` is sent. Idle streams carry a comment
        every 15 s. The server ends a stream whose client falls too far
        behind, and at shutdown; the `retry` field asks clients to
        reconnect after 1 s.
      parameters:
        - name: Last-Event-ID
          in: header
          description: ID of the last event received, to resume after it.
          schema: { type: string }
        - name: lastEventId
          in: query
          description: As Last-Event-ID, for clients that cannot set headers.
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 1000

                id: lx2k9q1c-7
                event: resource
                data: {"service":"gcs","namespace":"gcs/buckets","key":"my-bucket"}

                id: lx2k9q1c-8
                event: request
                data: {"time":"2026-10-08T12:00:00Z","service":"gcs","protocol":"http","method":"POST /storage/v1/b","status":200,"latencyMs":1.2}
  /_emu/v1/requests:
    get:
      summary: Recent request log entries, oldest first (FR-CORE-061).
      operationId: requests
      parameters:
        - name: service
          in: query
          description: Only entries of this service.
          schema: { type: string }
      responses:
        "200":
          description: Request log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/RequestEntry" }
  /_emu/v1/requests/{id}:
    get:
      summary: One request log entry with its request and response bodies (FR-UI-013).
      description: |
        Entries listed by /_emu/v1/requests and sent on the event stream
        leave out bodies; this returns them. Bodies are kept for API calls
        through the gateway: an HTTP body as sent, a unary gRPC message as
        protojson. Each keeps its first 16 KiB. 404 once the entry has
        left the log.
      operationId: request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/resources:
    get:
      summary: Dump of the control-plane store.
      operationId: resources
      parameters:
        - name: namespace
          in: query
          description: Only this store namespace (e.g. "compute/natsink").
          schema: { type: string }
      responses:
        "200":
          description: Namespace to key to stored value (JSON, or a string for non-JSON values).
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: {}
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/resources/counts:
    get:
      summary: Number of resources of each type, per service (Web console dashboard).
      operationId: resourceCounts
      description: >-
        Keys are service IDs and user-facing resource types named like the
        API's collections ("buckets", "subscriptions"), not store namespaces.
        Services that hold no resources of their own (cdn, nat) are absent.
      responses:
        "200":
          description: Service ID to resource type to count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceCounts" }
  /_emu/v1/operations:
    get:
      summary: Every Operation of every service (Web console Operations view, FR-UI-012).
      operationId: operations
      description: >-
        Operations of every wire format (google.longrunning, Compute, Cloud
        SQL, GKE, Cloud DNS changes) summarised in one shape, newest first.
        Services without Operations are absent. The `operation` events of
        /_emu/v1/events report changes to them.
      parameters:
        - name: service
          in: query
          description: Only this Service ID's Operations.
          schema: { type: string }
        - name: project
          in: query
          description: Only this Project's Operations.
          schema: { type: string }
      responses:
        "200":
          description: The Operations.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items: { $ref: "#/components/schemas/Operation" }
  /_emu/v1/reset:
    post:
      summary: Wipe all state, keeping configuration (`gcpemu reset`).
      operationId: reset
      description: |
        While it runs the Instance is not ready, and every request but the
        Admin API's is refused, and any in progress cut off, as UNAVAILABLE
        (HTTP 503 with Retry-After).
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/snapshots:
    get:
      summary: Saved State snapshots (`gcpemu snapshot list`, FR-CORE-012).
      operationId: listSnapshots
      responses:
        "200":
          description: State snapshots, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Save all state as a State snapshot (`gcpemu snapshot save`).
      operationId: saveSnapshot
      description: |
        Saves the Store, GCS and Artifact Registry blobs, a dump of every
        Cloud SQL instance's databases and its backup files under the
        instance dir's `snapshots/NAME`, replacing a snapshot of that name.
        Each RUNNING GKE cluster's k3s datastore is saved, so a restored
        cluster keeps its Kubernetes objects and cluster CA; PersistentVolume
        contents are not saved and come back empty, and a cluster that is
        not RUNNING comes back with a fresh data plane. Fails with
        409 while the Instance is not ready, an Operation is running, a
        Cloud SQL instance is stopped, or state keeps changing during the
        save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Up to 63 letters, digits, ".", "_" or "-", starting with a letter or digit.
      responses:
        "200":
          description: The saved State snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/snapshots/{name}/restore:
    post:
      summary: Replace all state with a State snapshot (`gcpemu snapshot restore`).
      operationId: restoreSnapshot
      description: |
        Resets the Instance and loads the snapshot, keeping configuration,
        Fault rules and the Emulator clock. Cloud SQL instances are running
        again when it returns; GKE clusters report RECONCILING until their
        data planes are back. Event streams get a `reset` event.
        While it runs the Instance is not ready, and every request but the
        Admin API's is refused, and any in progress cut off, as UNAVAILABLE
        (HTTP 503 with Retry-After).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/snapshots/{name}:
    delete:
      summary: Delete a State snapshot (`gcpemu snapshot delete`).
      operationId: deleteSnapshot
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/time/advance:
    post:
      summary: Advance the emulator clock (`gcpemu time advance`, FR-GCS-008).
      operationId: advanceTime
      parameters:
        - name: by
          in: query
          required: true
          description: Non-negative Go duration, e.g. "24h".
          schema: { type: string }
      responses:
        "200":
          description: The new emulator time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /_emu/v1/faults:
    get:
      summary: Active fault injection rules (FR-CORE-060).
      operationId: listFaults
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  faults:
                    type: array
                    items: { $ref: "#/components/schemas/FaultRule" }
    post:
      summary: Add a fault injection rule.
      operationId: addFault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaultRule" }
      responses:
        "200":
          description: The added rule with its ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultRule" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove every fault injection rule.
      operationId: clearFaults
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /_emu/v1/faults/{id}:
    patch:
      summary: Enable or disable a fault injection rule (FR-UI-016).
      description: A disabled rule stays listed, with its hit count, but does not fire.
      operationId: setFaultDisabled
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultRule" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove one fault injection rule.
      operationId: removeFault
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/shutdown:
    post:
      summary: Shut the instance down gracefully (`gcpemu stop`).
      operationId: shutdown
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /_emu/v1/cdn:
    get:
      summary: Cloud CDN cache statistics (cdn service; Web console Cloud CDN view).
      operationId: cdnStats
      description: >-
        The cache's usage, and each backend service or bucket with cached
        entries or traffic since the Instance started or was reset. Purging
        keeps the traffic totals.
      parameters:
        - name: project
          in: query
          description: Only this Project's backends.
          schema: { type: string }
      responses:
        "200":
          description: Cache usage.
          content:
            application/json:
              schema:
                type: object
                required: [entries, bytes, limitBytes, backends]
                properties:
                  entries: { type: integer }
                  bytes: { type: integer }
                  limitBytes: { type: integer }
                  backends:
                    type: array
                    items: { $ref: "#/components/schemas/CdnBackend" }
  /_emu/v1/cdn/entries:
    get:
      summary: One backend's cached responses (cdn service; Web console Cloud CDN view).
      operationId: cdnEntries
      parameters:
        - name: backend
          in: query
          required: true
          description: The backend service or bucket's resource path or selfLink.
          schema: { type: string }
        - name: limit
          in: query
          description: At most this many entries (default and maximum 1000).
          schema: { type: integer }
      responses:
        "200":
          description: The entries, by host and path.
          content:
            application/json:
              schema:
                type: object
                required: [entries, truncated]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/CdnEntry" }
                  truncated: { type: boolean, description: More entries were left out. }
        "400": { $ref: "#/components/responses/Error" }
  /_emu/v1/cdn/purge:
    post:
      summary: Clear the Cloud CDN cache (`gcpemu cdn purge`, FR-CDN-008).
      operationId: cdnPurge
      responses:
        "200":
          description: Number of entries removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: integer }
  /_emu/v1/pubsub/subscriptions:
    get:
      summary: Pub/Sub subscription statistics (pubsub service; Web console Pub/Sub view).
      operationId: pubsubStats
      description: >-
        What GCP reports as Cloud Monitoring metrics of a subscription
        (num_undelivered_messages, oldest_unacked_message_age,
        dead_letter_message_count), for every subscription in one call. The
        emulator serves them as Cloud Monitoring time series too, under
        /monitoring/v3/projects/{project}/timeSeries.
      parameters:
        - name: project
          in: query
          description: Only this Project's subscriptions.
          schema: { type: string }
      responses:
        "200":
          description: The subscriptions, by name.
          content:
            application/json:
              schema:
                type: object
                required: [now, subscriptions]
                properties:
                  now:
                    type: string
                    format: date-time
                    description: >-
                      The Emulator clock, which publish times follow. Seeking
                      a subscription to it purges every message published so far.
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionStats" }
  /_emu/v1/lb/listeners:
    get:
      summary: Each forwarding rule's local listener (lb service, FR-LB-002; Web console Load Balancer view).
      operationId: lbListeners
      parameters:
        - name: project
          in: query
          description: Only this Project's forwarding rules.
          schema: { type: string }
      responses:
        "200":
          description: The listeners, by forwarding rule.
          content:
            application/json:
              schema:
                type: object
                required: [listeners]
                properties:
                  listeners:
                    type: array
                    items: { $ref: "#/components/schemas/LbListener" }
                  unavailable:
                    type: array
                    description: The forwarding rules that have no listener, such as one on a port in a Windows excluded port range.
                    items: { $ref: "#/components/schemas/LbUnavailable" }
                  withheld:
                    type: array
                    description: >-
                      The GCPEMU_LB_* variables `gcpemu env` does not print because
                      more than one forwarding rule would (ADR 0013); with project,
                      those involving one of its rules.
                    items: { $ref: "#/components/schemas/LbWithheld" }
  /_emu/v1/lb/route:
    post:
      summary: Which route and backend of a URL map would serve a request (lb service; Web console Load Balancer view).
      operationId: lbRoute
      description: >-
        Routes the request with the stored URL map exactly as the load
        balancer's data plane does (FR-LB-003), without sending it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LbRouteRequest" }
      responses:
        "200":
          description: The routing decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LbRoute" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/dns/query:
    get:
      summary: Resolve a name against the Instance's DNS server (dns service; Web console Cloud DNS view).
      operationId: dnsQuery
      description: >-
        Sends the query over the wire to the DNS data plane, as dig would,
        so it is answered (and logged) as a client's query is. With network
        it carries the VPC network in the EDNS0 option a VPC's DNS relay
        adds, so that private zones bound to that network are visible.
      parameters:
        - name: name
          in: query
          required: true
          description: The name to resolve; a trailing dot is added.
          schema: { type: string }
        - name: type
          in: query
          description: The record type, e.g. A, AAAA, CNAME, MX, TXT (default A).
          schema: { type: string }
        - name: network
          in: query
          description: Query from this VPC network (projects/P/global/networks/N or its URL) instead of the host.
          schema: { type: string }
      responses:
        "200":
          description: The DNS server's response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsQueryResult" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /_emu/v1/nat/sink:
    get:
      summary: Whether Cloud NAT's offline sink is on (nat service; FR-NAT-005, Web console Cloud NAT view).
      operationId: natSink
      responses:
        "200":
          description: The sink's state and response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NatSink" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      summary: Switch Cloud NAT's offline sink until the Instance stops (Web console Cloud NAT view).
      operationId: setNatSink
      description: >-
        While the sink is on, TCP egress a Cloud NAT allows is answered by
        the sink in the NAT egress proxy, recorded and logged as
        OFFLINE_SINK, instead of reaching the internet. Running NAT egress
        proxies are re-programmed; `--offline` turns it on again at the
        next start. The sink's response (natSinkResponse) is read only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The sink's state now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NatSink" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /_emu/v1/build/projects/{project}/locations/{location}/builds/{id}/log:
    get:
      summary: A Build's log, as its logUrl points to (build service).
      operationId: buildLog
      description: >-
        Each step's output, line by line after "Step #N" (and its id), with
        the lines Cloud Build adds around the steps. Logs are kept in
        memory until the Instance stops or resets; a Build of the global
        location (projects/*/builds) is under locations/global.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: location, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The log so far.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/sql/hosts:
    get:
      summary: How host clients reach each running public Cloud SQL instance (sql service; gcpemu doctor).
      operationId: sqlHosts
      description: >-
        Where the host can't reach an instance's public IP (a VM runtime,
        ADR 0005 and ADR 0012), the address is the loopback address the
        instance serves ports 3307 and 5432 on, and an instance without one
        is listed with why. Otherwise it is the instance's public IP.
      responses:
        "200":
          description: The public instances, by connection name.
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items: { $ref: "#/components/schemas/SqlHost" }
                  aliasesRefused:
                    type: boolean
                    description: >-
                      The runtime refused to publish on a loopback alias, so
                      a Containerized Instance uses only 127.0.0.1 until it
                      restarts, whatever GCPEMU_LOOPBACK_ALIASES says.
  /_emu/v1/ca/rotate:
    post:
      summary: Replace the instance CA and re-issue managed certificates (`gcpemu ca rotate`; certs service).
      operationId: caRotate
      responses:
        "200":
          description: The CA was rotated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rotated] }
                  path: { type: string, description: Path of the new ca.pem. }
        "412":
          description: The instance has no CA (Google JSON error envelope).
        "500":
          description: Rotation failed (Google JSON error envelope).
  /_emu/v1/host/address:
    get:
      summary: The Host address of a subnetwork (compute service; `gcpemu host-address`, ADR 0014).
      operationId: hostAddress
      description: >-
        The address at which the workloads on the subnetwork's VPC container
        network reach the host: the VPC container network's own gateway IP
        where the host routes to it, and an address the VM relay holds on a
        VM runtime. It is not the subnetwork's gatewayAddress, though the two
        can be the same IP when there is no Fallback range. It stays the same
        for the life of a Persistent Instance. Asking realises the
        container network, and starts the VM relay, when they are not yet.
      parameters:
        - $ref: "#/components/parameters/Subnetwork"
      responses:
        "200":
          description: The subnetwork's Host address and Offered ports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostOffers" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/host/offers:
    get:
      summary: The Offered ports (compute service; `gcpemu status`, Web console VPC network view).
      operationId: listHostOffers
      parameters:
        - name: subnetwork
          in: query
          description: Only this subnetwork's (projects/P/regions/R/subnetworks/S).
          schema: { type: string }
      responses:
        "200":
          description: The subnetworks with Offered ports.
          content:
            application/json:
              schema:
                type: object
                required: [subnetworks]
                properties:
                  subnetworks:
                    type: array
                    items: { $ref: "#/components/schemas/HostOffers" }
    post:
      summary: Offer host ports to a subnetwork's workloads (`gcpemu offer`, ADR 0014).
      operationId: createHostOffers
      description: >-
        Each port at the Host address forwards to the same port on the
        host's 127.0.0.1, over TCP, or UDP with "/udp". All the ports are
        offered or none is. Where the host routes to the network, a port
        that a host process holds on the wildcard address cannot be offered,
        and the error names that bind. Ports stay offered until they are
        withdrawn, across restarts of a Persistent Instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subnetwork, ports]
              properties:
                subnetwork: { type: string, description: "projects/P/regions/R/subnetworks/S" }
                ports:
                  type: array
                  items: { type: string, description: '"8080", "8080/tcp" or "53/udp"' }
      responses:
        "200":
          description: The subnetwork's Host address and Offered ports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostOffers" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Withdraw Offered ports (`gcpemu withdraw`, ADR 0014).
      operationId: deleteHostOffers
      description: Ports that are not offered are ignored. Connections already forwarded run on.
      parameters:
        - $ref: "#/components/parameters/Subnetwork"
        - name: port
          in: query
          required: true
          description: '"8080", "8080/tcp" or "53/udp"; repeated for several.'
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: The subnetwork's Host address and remaining Offered ports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostOffers" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /_emu/v1/host/services:
    get:
      summary: The Kubernetes Services host clients reach by name (gke service; `gcpemu status`, `gcpemu doctor`, ADR 0014).
      operationId: listHostServices
      description: >-
        The emulator's DNS answers a host query for
        <service>.<namespace>.svc.<cluster>.<location>.<project>.gke.internal,
        and for <service>.<namespace>.svc.cluster.local while exactly one
        cluster has that Service, with a Loopback alias the Service gets on
        the first query and keeps until it is deleted. Lists the Services
        that hold aliases, the short names that more than one cluster has
        (which do not resolve), and the Services a query found that got no
        alias, with why.
      responses:
        "200":
          description: The Services served to host clients.
          content:
            application/json:
              schema:
                type: object
                required: [services, collisions, unserved, poolExhausted]
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required: [cluster, namespace, service, name, address, ports]
                      properties:
                        cluster: { type: string, description: "projects/P/locations/L/clusters/C" }
                        namespace: { type: string }
                        service: { type: string }
                        name: { type: string, description: The qualified gke.internal name. }
                        shortName: { type: string, description: The svc.cluster.local name, while no other cluster has the Service. }
                        address: { type: string, description: The Loopback alias. }
                        ports:
                          type: array
                          description: The TCP ports served there now.
                          items: { type: integer }
                  collisions:
                    type: array
                    items:
                      type: object
                      required: [name, clusters]
                      properties:
                        name: { type: string }
                        clusters:
                          type: array
                          items: { type: string }
                  unserved:
                    type: array
                    items:
                      type: object
                      required: [cluster, namespace, service, reason]
                      properties:
                        cluster: { type: string }
                        namespace: { type: string }
                        service: { type: string }
                        reason: { type: string }
                  poolExhausted:
                    type: boolean
                    description: A Service got no alias because 127.0.0.2-127.0.0.254 are all held.
components:
  securitySchemes:
    adminTokenHeader:
      type: apiKey
      in: header
      name: X-Gcpemu-Admin-Token
      description: The admin token; required only when the API gateway is bound beyond loopback.
    adminTokenCookie:
      type: apiKey
      in: cookie
      name: gcpemu_admin
      description: The admin token as set by opening the console URL printed at startup.
  parameters:
    Subnetwork:
      name: subnetwork
      in: query
      required: true
      description: The subnetwork, as projects/P/regions/R/subnetworks/S.
      schema: { type: string }
  responses:
    Status:
      description: The operation succeeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
    Error:
      description: The operation failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    IamEnforcement:
      type: object
      required: [level]
      properties:
        level: { type: string, enum: ["off", audit, enforce] }
    IamDenial:
      type: object
      required: [id, principal, permission, resource, level, count, firstTime, lastTime, granted]
      properties:
        id: { type: string, description: "Stable for the Principal, permission, resource and deny policy." }
        principal: { type: string, description: "The caller, e.g. serviceAccount:EMAIL." }
        permission: { type: string, description: The permission the caller lacked. }
        resource: { type: string, description: The full resource name the permission was checked on. }
        denyPolicy:
          type: string
          description: "The IAM v2 deny policy that refused the permission, e.g. policies/cloudresourcemanager.googleapis.com%2Fprojects%2F123/denypolicies/no-destroy. Absent when no allow policy granted it."
        service: { type: string, description: The Service ID of the latest denied call. }
        method: { type: string, description: The latest denied call's method, as the Request log names it. }
        level:
          type: string
          enum: [audit, enforce]
          description: The IAM enforcement level of the latest denied call; under enforce it failed with PERMISSION_DENIED.
        count: { type: integer, description: How many calls were denied. }
        firstTime: { type: string, format: date-time }
        lastTime: { type: string, format: date-time }
        role: { type: string, description: "The smallest predefined role granting the permission, e.g. roles/storage.objectViewer. Absent for a deny policy's denial, which no grant overrides." }
        roleTitle: { type: string }
        project: { type: string, description: The ID of the Project owning the resource, where a binding of the role grants the permission. }
        granted: { type: boolean, description: "The Principal now holds the permission on the resource, and no deny policy refuses it." }
    Info:
      type: object
      required: [instance, id, pid, version, dir, ephemeral, iamMode, strictProjects, console, services, endpoints, runtime]
      properties:
        instance: { type: string }
        id: { type: string }
        pid: { type: integer }
        version: { type: string }
        dir: { type: string, description: Instance data directory. }
        ephemeral: { type: boolean }
        iamMode: { type: string, enum: ["off", audit, enforce] }
        strictProjects:
          type: boolean
          description: Referencing a project that does not exist is an error instead of creating it.
        console: { type: boolean, description: Whether the API gateway serves the Web console under /console/. }
        services:
          type: array
          description: Enabled services, in start order.
          items: { type: string }
        endpoints: { $ref: "#/components/schemas/Endpoints" }
        runtime: { $ref: "#/components/schemas/RuntimeStatus" }
    RuntimeStatus:
      type: object
      description: >-
        The container runtime the instance uses, or would use once a service
        needs one. Probed at most every few seconds.
      required: [kind, reachable]
      properties:
        kind: { type: string, enum: [docker, podman, none] }
        version: { type: string }
        reachable: { type: boolean }
        error: { type: string, description: Why the runtime is not reachable. }
    Container:
      type: object
      required: [name, image, state]
      properties:
        name: { type: string }
        service: { type: string }
        resource: { type: string }
        role: { type: string }
        image: { type: string }
        state: { type: string }
    ResourceCounts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: { type: integer }
    Endpoints:
      type: object
      description: Service endpoint name ("gateway", "gcs", "lb:PROJECT/REGION_OR_GLOBAL/FORWARDING_RULE", ...) to host:port.
      additionalProperties: { type: string }
    Readiness:
      type: object
      required: [ready, services]
      properties:
        ready: { type: boolean }
        services:
          type: object
          description: >-
            Readiness by Service ID, plus any readiness holds and a
            "containers" entry while Managed containers are disrupted.
          additionalProperties:
            type: object
            required: [ready]
            properties:
              ready: { type: boolean }
              reason: { type: string }
    Operation:
      type: object
      required: [service, name, done]
      properties:
        service: { type: string, description: Service ID that owns the Operation. }
        name:
          type: string
          description: The Operation's resource name, e.g. "projects/p/global/operations/operation-1".
        project: { type: string }
        location: { type: string, description: '"global", a region, a zone or an API location.' }
        type:
          type: string
          description: What the Operation does, as its API names it ("insert", "CREATE_CLUSTER", "change").
        target: { type: string, description: The resource the Operation acts on or produced. }
        status: { type: string, description: 'The API''s own status ("RUNNING", "pending", "DONE").' }
        done: { type: boolean }
        error:
          type: object
          description: Why the Operation failed.
          required: [message]
          properties:
            code: { type: string, description: 'e.g. "NOT_FOUND", "RESOURCE_ALREADY_EXISTS".' }
            message: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        operation:
          type: object
          additionalProperties: {}
          description: The Operation as the Service's API returns it.
    SubscriptionStats:
      type: object
      required: [name, topic, backlog, backlogBytes, outstanding, deadLettered]
      properties:
        name: { type: string, description: The subscription's resource name. }
        topic: { type: string }
        backlog: { type: integer, description: Unacked messages, leased or not. }
        backlogBytes: { type: integer }
        outstanding: { type: integer, description: Messages leased to a subscriber now. }
        oldestUnackedPublishTime:
          type: string
          format: date-time
          description: Publish time of the oldest unacked message; absent when the backlog is empty.
        deadLettered:
          type: integer
          description: Messages forwarded to the dead-letter topic since the Instance started.
    HostOffers:
      type: object
      required: [subnetwork, hostAddress, offers]
      properties:
        subnetwork: { type: string }
        hostAddress: { type: string }
        offers:
          type: array
          items:
            type: object
            required: [port, protocol]
            properties:
              port: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
    CdnBackend:
      type: object
      required: [backend, entries, bytes, hits, misses, revalidated, uncacheable]
      properties:
        backend: { type: string, description: The backend service or bucket's resource path. }
        entries: { type: integer }
        bytes: { type: integer }
        hits: { type: integer, description: "Responses served from cache ({cdn_cache_status} hit)." }
        misses: { type: integer, description: Responses filled from the origin. }
        revalidated: { type: integer, description: Stale entries the origin confirmed. }
        uncacheable: { type: integer, description: Responses the cache could not store or bypassed. }
    CdnEntry:
      type: object
      required: [host, path, cacheKey, status, bytes, stored, age, ttl, tier]
      properties:
        host: { type: string }
        path: { type: string }
        cacheKey: { type: string, description: The cache key per the backend's cache key policy. }
        status: { type: integer }
        bytes: { type: integer }
        contentType: { type: string }
        stored: { type: string, format: date-time, description: When it was filled or revalidated. }
        age: { type: integer, description: Age in seconds. }
        ttl: { type: integer, description: Freshness lifetime in seconds. }
        vary: { type: array, items: { type: string }, description: Request headers the entry varies on. }
        tags: { type: array, items: { type: string }, description: Its Cache-Tag values. }
        tier: { type: string, enum: [memory, disk] }
    DnsQueryResult:
      type: object
      required: [server, name, type, rcode, authoritative, recursionAvailable, answer, authority, additional, latencyMs]
      properties:
        server: { type: string, description: The DNS server's host:port. }
        name: { type: string, description: The name asked, fully qualified. }
        type: { type: string }
        network: { type: string, description: The VPC network the query came from, if any. }
        rcode: { type: string, description: "NOERROR, NXDOMAIN, REFUSED, SERVFAIL, ..." }
        authoritative: { type: boolean }
        recursionAvailable: { type: boolean, description: False when forwarding is off (--dns-no-forward). }
        zone: { type: string, description: "The managed zone that answers the name on that network (projects/P/managedZones/Z); absent when the name is forwarded." }
        answer: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        authority: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        additional: { type: array, items: { $ref: "#/components/schemas/DnsRecord" } }
        latencyMs: { type: number }
    DnsRecord:
      type: object
      required: [name, type, ttl, data]
      properties:
        name: { type: string }
        type: { type: string }
        ttl: { type: integer }
        data: { type: string, description: The record's data in presentation format. }
    LbListener:
      type: object
      required: [forwardingRule, ipAddress, port, listener, mode, https]
      properties:
        forwardingRule: { type: string, description: The forwarding rule's resource path. }
        ipAddress: { type: string, description: The forwarding rule's IP address. }
        port: { type: integer }
        listener: { type: string, description: The host:port clients connect to. }
        mode:
          type: string
          enum: [loopback, edge, fallback]
          description: >-
            loopback is 127.0.0.x on the rule's port, edge the lb-edge
            container (privileged ports), fallback 127.0.0.x on a high port.
        https: { type: boolean }
    SqlHost:
      type: object
      required: [instance]
      properties:
        instance: { type: string, description: "The instance's connection name, PROJECT:REGION:NAME." }
        address: { type: string, description: The address host clients dial; absent when the instance has none. }
        loopback: { type: boolean, description: The address is a loopback address standing in for the public IP. }
        missing: { type: string, description: Why the instance has no address. }
    LbUnavailable:
      type: object
      required: [forwardingRule, ipAddress, port, error]
      properties:
        forwardingRule: { type: string, description: The forwarding rule's resource path. }
        ipAddress: { type: string, description: The forwarding rule's IP address. }
        port: { type: integer }
        error: { type: string, description: Why the rule has no listener. }
    LbWithheld:
      type: object
      required: [variable, forwardingRules, qualified]
      properties:
        variable: { type: string, description: The withheld variable. }
        forwardingRules:
          type: array
          description: The resource paths of the forwarding rules that would print it.
          items: { type: string }
        qualified:
          type: array
          description: Each rule's qualified GCPEMU_LB_PROJECT_SCOPE_NAME variable, in the order of forwardingRules.
          items: { type: string }
    LbRouteRequest:
      type: object
      required: [urlMap, host]
      properties:
        urlMap: { type: string, description: The URL map's resource path or selfLink. }
        scheme: { type: string, enum: [http, https], default: http }
        method: { type: string, default: GET }
        host: { type: string }
        path: { type: string, description: Path and optional query; defaults to /. }
        headers:
          type: object
          additionalProperties: { type: string }
    LbRoute:
      type: object
      required: [match, host, path]
      properties:
        match:
          type: string
          enum: [routeRule, pathRule, pathMatcherDefault, urlMapDefault]
        pathMatcher: { type: string, description: The path matcher the host selected. }
        routeRule:
          type: object
          additionalProperties: true
          description: The matched compute HttpRouteRule.
        pathRule:
          type: object
          additionalProperties: true
          description: The matched compute PathRule.
        service: { type: string, description: The backend service or bucket, absent for a redirect. }
        weightedBackendServices:
          type: array
          description: The weighted backend services the request is split across, when more than one.
          items:
            type: object
            additionalProperties: true
        redirect:
          type: object
          required: [code, location]
          properties:
            code: { type: integer }
            location: { type: string }
        host: { type: string, description: The host after URL rewrites. }
        path: { type: string, description: The path after URL rewrites. }
        headerActions:
          type: array
          description: The header actions that apply, most specific first.
          items:
            type: object
            additionalProperties: true
    ResourceChange:
      type: object
      description: Data of a `resource` event.
      required: [service, namespace, key]
      properties:
        service:
          type: string
          description: >-
            The namespace's first segment: a Service ID, or "core" for state
            the emulator owns (Projects in "core/projects").
        namespace: { type: string, description: Store namespace, e.g. "gcs/buckets". }
        key: { type: string, description: Store key within the namespace. }
        deleted: { type: boolean }
    OperationChange:
      type: object
      description: Data of an `operation` event.
      required: [service, namespace, name, done]
      properties:
        service: { type: string, description: Service ID that owns the Operation. }
        namespace: { type: string, description: Store namespace, e.g. "lro/operations". }
        name:
          type: string
          description: >-
            The Operation's name for google.longrunning Operations,
            otherwise its store key (e.g. "P/OP" for Cloud SQL).
        done: { type: boolean }
        deleted: { type: boolean }
    RequestEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Numbers the entries of one Instance process from 1, in order.
        time: { type: string, format: date-time }
        service: { type: string }
        protocol: { type: string, description: "http, grpc, dns, postgres, tcp, udp" }
        method: { type: string }
        resource: { type: string }
        principal: { type: string }
        status:
          type: integer
          description: >-
            HTTP status, gRPC code or DNS rcode; for connections 0 when admitted and 1 when
            refused.
        code: { type: string }
        latencyMs: { type: number }
        lb: { $ref: "#/components/schemas/LbTrace" }
        nat: { $ref: "#/components/schemas/NatTrace" }
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestEntry"
        - type: object
          properties:
            requestBody: { $ref: "#/components/schemas/RequestBody" }
            responseBody: { $ref: "#/components/schemas/RequestBody" }
    RequestBody:
      type: object
      description: The start of a request or response body.
      required: [size]
      properties:
        contentType: { type: string }
        size: { type: integer, format: int64, description: The body's length in bytes. }
        text: { type: string, description: The first 16 KiB; absent when binary. }
        truncated: { type: boolean, description: Text is only the start of the body. }
        binary: { type: boolean, description: The body is not UTF-8 text. }
    NatTrace:
      type: object
      description: >-
        One connection the NAT egress proxy saw leave a VPC network
        (nat service; Web console Cloud NAT translation log): the entry's
        code is OK (translated), DROPPED (no Cloud NAT covers the source)
        or OFFLINE_SINK, and its resource the Cloud NAT gateway
        (projects/P/regions/R/routers/ROUTER/nats/NAT), or the network
        when no NAT covers the source.
      required: [network, srcIp, srcPort, destIp, destPort]
      properties:
        network: { type: string, description: The VPC network's resource path. }
        subnetwork: { type: string, description: The source's subnetwork's resource path. }
        vm: { type: string, description: The workload holding the source address, e.g. a GKE node. }
        srcIp: { type: string }
        srcPort: { type: integer }
        destIp: { type: string }
        destPort: { type: integer }
        natIp: { type: string, description: The NAT IP a translation used. }
        natPort: { type: integer, description: The NAT port a translation used. }
        request: { type: string, description: The first line the offline sink received. }
    NatSink:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        status: { type: integer, description: The HTTP status the sink answers with. }
        body: { type: string, description: The body the sink answers with. }
    LbTrace:
      type: object
      description: >-
        How a load balancer served one data-plane request (lb service; Web
        console Load Balancer traffic view). The forwarding rule is the
        entry's resource.
      required: [host, path]
      properties:
        host: { type: string }
        path: { type: string, description: The path and query as the client sent them. }
        targetProxy: { type: string, description: The target proxy's resource path. }
        urlMap: { type: string, description: The URL map's resource path. }
        match:
          type: string
          enum: [routeRule, pathRule, pathMatcherDefault, urlMapDefault]
          description: The URL map rule that matched; absent when the URL map is missing or invalid.
        pathMatcher: { type: string }
        priority: { type: integer, format: int64, description: The matched route rule's priority. }
        paths:
          type: array
          items: { type: string }
          description: The matched path rule's paths.
        redirect: { type: string, description: Location of a redirect the load balancer answered with. }
        backend: { type: string, description: The backend service or bucket's resource path. }
        endpoint: { type: string, description: The endpoint (ip:port) or bucket that answered. }
        cacheStatus:
          type: string
          enum: [hit, miss, revalidated, uncacheable, disabled]
          description: Cloud CDN's {cdn_cache_status}; disabled when the backend has no CDN.
        statusDetails: { type: string, description: The access log's statusDetails. }
        backendLatencyMs: { type: number }
    Snapshot:
      type: object
      description: A saved State snapshot.
      required: [name, createTime, services, sizeBytes]
      properties:
        name: { type: string }
        createTime: { type: string, format: date-time, description: The host's time of the save, not the Emulator clock. }
        services:
          type: array
          items: { type: string }
          description: Service IDs the Instance ran when it was saved.
        sizeBytes: { type: integer, format: int64, description: Size of the snapshot's files on disk. }
    FaultRule:
      type: object
      properties:
        id: { type: string, readOnly: true }
        service: { type: string, description: Emulator service name ("gcs", "pubsub", ...). }
        method:
          type: string
          description: Regexp on the method ("GET /storage/v1/b", "/google.pubsub.v1.Publisher/Publish").
        resource: { type: string, description: Regexp on the request path or resource. }
        code: { type: string, description: Canonical error name to return, e.g. UNAVAILABLE. }
        httpStatus: { type: integer, description: Overrides the HTTP status for code. }
        latency: { type: string, description: Delay added before handling, e.g. "250ms". }
        drop: { type: boolean, description: Close the connection without a response. }
        probability: { type: number, description: "In (0,1]; 0 means always." }
        count: { type: integer, description: How many times the rule fires; 0 means unlimited. }
        disabled: { type: boolean, description: The rule is kept but does not fire. }
        fired: { type: integer, readOnly: true, description: How many times the rule has fired. }
