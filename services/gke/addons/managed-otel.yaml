# The Managed collector (FR-GKE-019, ADR 0034). No collector pods run in the
# cluster: the Service names the node-local address (metadata.google.internal,
# 169.254.169.254) where the node agent relays OTLP to the Instance.
apiVersion: v1
kind: Namespace
metadata:
  name: gke-managed-otel
---
# Instrumentation (FR-GKE-021, instrumentation.go). GKE publishes no schema;
# this one has the fields "Deploy Managed OpenTelemetry for GKE" documents.
# The providers are nullable because null turns a signal off, and other
# OTel SDK configuration is kept as written.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instrumentations.telemetry.googleapis.com
spec:
  group: telemetry.googleapis.com
  names:
    kind: Instrumentation
    listKind: InstrumentationList
    plural: instrumentations
    singular: instrumentation
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector:
                  type: object
                  x-kubernetes-map-type: atomic
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        required: [key, operator]
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            items:
                              type: string
                autoInstrumentationConfig:
                  type: object
                  properties:
                    configInjection:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                otelSDKConfig:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    tracer_provider:
                      type: object
                      nullable: true
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        sampler:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            parent_based:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              properties:
                                root:
                                  type: object
                                  x-kubernetes-preserve-unknown-fields: true
                                  properties:
                                    trace_id_ratio_based:
                                      type: object
                                      properties:
                                        ratio:
                                          type: string
                    meter_provider:
                      type: object
                      nullable: true
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        readers:
                          type: array
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            properties:
                              periodic:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                                properties:
                                  interval:
                                    type: integer
                                    minimum: 5000
                                    maximum: 300000
                                    multipleOf: 5000
                    logger_provider:
                      type: object
                      nullable: true
                      x-kubernetes-preserve-unknown-fields: true
                promptsResponses:
                  type: object
                  properties:
                    uploadBasePath:
                      type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: gke-managed-otel
spec:
  type: ExternalName
  externalName: metadata.google.internal
  ports:
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      protocol: TCP
      appProtocol: http
