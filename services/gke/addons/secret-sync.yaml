# GKE's secret synchronization (secretSyncConfig): the SecretSync resource
# (secret-sync.gke.io/v1). GKE does not publish its schema; this one
# carries the documented fields. The controller runs in the emulator
# (secretsync.go).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsyncs.secret-sync.gke.io
spec:
  group: secret-sync.gke.io
  scope: Namespaced
  names:
    kind: SecretSync
    listKind: SecretSyncList
    plural: secretsyncs
    singular: secretsync
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="SecretSynced")].status
        - name: Last sync
          type: date
          jsonPath: .status.lastSuccessfulSyncTime
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [serviceAccountName, secretProviderClassName, secretObject]
              properties:
                serviceAccountName:
                  type: string
                secretProviderClassName:
                  type: string
                secretObject:
                  type: object
                  required: [type, data]
                  properties:
                    type:
                      type: string
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    data:
                      type: array
                      items:
                        type: object
                        required: [sourcePath, targetKey]
                        properties:
                          sourcePath:
                            type: string
                          targetKey:
                            type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
