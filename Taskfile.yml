# ADR 0018: Task runs every command through its built-in POSIX shell
# interpreter, so these tasks run from PowerShell, cmd, zsh or bash. They
# call no Unix-only programs (grep, sed, awk, ...): only go (and gofmt),
# git, pnpm, docker and npm, and the interpreter's builtins.
version: "3"

vars:
  # Evaluated once, before the console build rewrites
  # console/dist/index.html. `task release VERSION=v1.2.3` overrides it.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/linuxuser586/gcpemu/internal/instance.Version={{.VERSION}}
  # FR-UI-001: the Web console is embedded from console/dist. Building it
  # overwrites the committed placeholder console/dist/index.html, which is
  # put back once the binaries are built, or when the build fails.
  CONSOLE_PLACEHOLDER: console/dist/index.html
  RESTORE_PLACEHOLDER: git checkout -- {{.CONSOLE_PLACEHOLDER}} 2>/dev/null || true

tasks:
  # #541: a bare `task` lists the tasks rather than building.
  default:
    desc: List the tasks (task doctor checks the tools they need)
    silent: true
    cmds:
      - task --list

  # #541: the tools for building and testing gcpemu; `gcpemu doctor` checks
  # a host for running it. Required tools fail the task, optional ones warn
  # and name the tasks they block. Nothing is installed.
  doctor:
    desc: Check the tools for building and testing gcpemu (bin/gcpemu doctor checks running it)
    silent: true
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - cmd: |
          fails=0 warns=0
          ok() { echo "ok    $1"; }
          fail() { echo "FAIL  $1"; fails=$((fails + 1)); }
          warn() { echo "warn  $1"; warns=$((warns + 1)); }
          # vge HAVE NEED: version HAVE >= NEED, field by field; a field's
          # non-digit suffix (1.28rc1) is dropped.
          vge() {
            h=$1 n=$2
            while [ -n "$h$n" ]; do
              hf=${h%%.*} nf=${n%%.*}
              case $h in *.*) h=${h#*.} ;; *) h= ;; esac
              case $n in *.*) n=${n#*.} ;; *) n= ;; esac
              hf=${hf%%[!0-9]*} nf=${nf%%[!0-9]*}
              [ "${hf:-0}" -gt "${nf:-0}" ] && return 0
              [ "${hf:-0}" -lt "${nf:-0}" ] && return 1
            done
            return 0
          }

          # Required. 3.54.0 is the version CI pins.
          have={{.TASK_VERSION}}
          have=${have#v}
          if vge "$have" 3.54.0; then ok "task $have"
          else fail "task $have: need >= 3.54.0; install: https://taskfile.dev/installation"; fi

          need=
          while IFS= read -r line; do
            case $line in "go "*) need=${line#go } ;; esac
          done < go.mod
          gook=
          if ! command -v go >/dev/null; then
            fail "go: not found, need >= $need; install: https://go.dev/dl"
          elif ! have=$(go env GOVERSION 2>&1); then
            fail "go: $have"
          else
            have=${have%% *}
            have=${have#go}
            if vge "$have" "$need"; then ok "go $have"; gook=1
            else fail "go $have: need >= $need; install: https://go.dev/dl"; fi
          fi

          if have=$(git --version 2>/dev/null); then ok "${have% (*}"
          else fail "git: not found; install: https://git-scm.com/downloads"; fi

          # Optional: the tasks each one blocks.
          need= pin=
          while IFS= read -r line; do
            case $line in
              *'"node": ">='*) need=${line#*>=} need=${need%%\"*} ;;
              *'"packageManager": "pnpm@'*) pin=${line#*pnpm@} pin=${pin%%\"*} ;;
            esac
          done < console/package.json
          if ! have=$(node --version 2>/dev/null); then
            warn "node: not found, need >= $need (task console, console-e2e, release); install: https://nodejs.org"
          elif vge "${have#v}" "$need"; then ok "node $have"
          else warn "node $have: need >= $need (task console, console-e2e, release); install: https://nodejs.org"; fi

          if ! have=$(cd console && pnpm --version 2>/dev/null); then
            warn "pnpm: not found, console pins $pin (task console, console-e2e, release); run: corepack enable"
          elif [ "${have%%.*}" = "${pin%%.*}" ]; then ok "pnpm $have"
          else warn "pnpm $have: console pins $pin (task console, console-e2e, release); run: corepack enable"; fi

          if ! command -v docker >/dev/null; then
            warn "docker: not found (task agent, e2e, compat, tofu); install Docker, Colima or Podman"
          elif have=$(docker version --format '{{"{{"}}.Server.Version{{"}}"}}' 2>/dev/null) && [ -n "$have" ]; then
            ok "docker (server $have)"
          else
            warn "docker: no daemon answers (task agent, e2e, compat, tofu); start Docker, Colima or Podman"
          fi

          # The check task race's precondition makes.
          if [ -n "$gook" ]; then
            if [ "$(go env CGO_ENABLED)" = 1 ]; then ok "cgo (CC=$(go env CC))"
            else warn "cgo: off, no C compiler $(go env CC) (task race); install one, e.g. xcode-select --install, build-essential or MinGW-w64"; fi
          fi

          if have=$(npm --version 2>/dev/null); then ok "npm $have"
          else warn "npm: not found (task action); it comes with Node.js"; fi

          if command -v tofu >/dev/null; then ok "tofu"
          else warn "tofu: not found (task tofu, e2e); install: https://opentofu.org/docs/intro/install/"; fi

          # task compat downloads its other clients; these must be on PATH,
          # and each test skips without its own.
          missing=
          for c in gcloud kubectl dig; do
            command -v $c >/dev/null || missing=${missing:+$missing, }$c
          done
          if [ -z "$missing" ]; then ok "gcloud, kubectl, dig"
          else warn "task compat: missing $missing; install: https://cloud.google.com/sdk/docs/install (gcloud components install kubectl), dig from BIND (dnsutils, bind-utils, brew install bind)"; fi

          echo
          echo "$fails required and $warns optional tools missing or too old. For running the emulator: bin/gcpemu doctor"
          [ "$fails" -eq 0 ]

  # Builds the console first when pnpm is on PATH; without it the binary
  # embeds the "console not built" placeholder.
  build:
    desc: Build bin/gcpemu, with the Web console when pnpm is on PATH
    env:
      CGO_ENABLED: "0"
    cmds:
      - defer: "{{.RESTORE_PLACEHOLDER}}"
        silent: true
      - task: console
        if: command -v pnpm
      - cmd: >-
          echo "warning: pnpm not found; embedding the Web console placeholder
          (install Node.js 24 and pnpm for the real console)" >&2
        if: "! command -v pnpm"
        silent: true
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o bin/gcpemu{{exeExt}} ./cmd/gcpemu

  # ADR 0005: the linux binary that Managed containers run, next to
  # bin/gcpemu, for the container runtime's architecture (the host's when
  # docker doesn't answer). Needed when the host isn't linux on that
  # architecture and the build isn't a release (vX.Y.Z).
  agent:
    desc: Build bin/gcpemu-linux-<arch> for the container runtime's architecture
    vars:
      ARCH:
        sh: |
          arch=$(docker version --format '{{"{{"}}.Server.Arch{{"}}"}}' 2>/dev/null)
          [ -n "$arch" ] || arch=$(go env GOARCH)
          echo "$arch"
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: "{{.ARCH}}"
    cmds:
      - cmd: echo "building linux/{{.ARCH}}"
        silent: true
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o bin/gcpemu-linux-{{.ARCH}} ./cmd/gcpemu

  console:
    desc: Build the Web console bundle into console/dist (needs pnpm)
    dir: console
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build

  # FR-UI-023: Playwright on Chromium, Firefox and WebKit against a binary
  # with the real console.
  console-e2e:
    desc: Run the Web console's Playwright tests against a fresh build
    cmds:
      - task: build
      - cd console && pnpm exec playwright test

  # #396: tests that run GKE clusters share GCPEMU_TEST_CLUSTERS slots (2)
  # across packages, so services/gke outlasts go test's default 10m.
  test:
    desc: Run the Go tests
    cmds:
      - go test -timeout 45m ./...

  # NFR-MNT-001: regenerate the API route tables and field-behaviour
  # validation (internal/apidef) from the pinned googleapis commit and the
  # discovery documents of the google.golang.org/api version in go.mod.
  # GOOGLEAPIS=latest (or a commit SHA) moves the googleapis pin first.
  generate:
    desc: Regenerate internal/apidef (GOOGLEAPIS=latest or a SHA moves the pin)
    dir: internal/apidef
    cmds:
      - go mod download google.golang.org/api
      - go run ./internal/apigen -config apis.yaml -out .{{if .GOOGLEAPIS}} -googleapis {{.GOOGLEAPIS}}{{end}}

  # The race detector needs cgo, which Go turns off without a C compiler.
  race:
    desc: Run the Go tests with the race detector (needs a C compiler)
    vars:
      CC:
        sh: go env CC
    preconditions:
      - sh: '[ "$(go env CGO_ENABLED)" = 1 ]'
        msg: "race: the race detector needs cgo and a C compiler ({{.CC}}); install one, or run task test"
    cmds:
      - go test -race -timeout 45m ./...

  vet:
    desc: Check gofmt, run go vet (with the e2e and compat build tags too), keep go-winio Windows-only and check ADR numbers
    cmds:
      - cmd: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
        silent: true
      - go vet ./...
      - go vet -tags e2e ./e2e/...
      - go vet -tags compat ./compat/...
      # ADR 0015 (#419): only Windows builds link go-winio. The template
      # prints the go-winio packages (the module's subpackages too) that a
      # linux or darwin build of the binary depends on.
      - cmd: |
          for goos in linux darwin; do
            out=$(GOOS=$goos go list -deps -f '{{"{{"}}with .Module{{"}}"}}{{"{{"}}if eq .Path "github.com/Microsoft/go-winio"{{"}}"}}{{"{{"}}$.ImportPath{{"}}"}}{{"{{"}}end{{"}}"}}{{"{{"}}end{{"}}"}}' ./cmd/gcpemu) || exit 1
            [ -z "$out" ] || {
              echo "$out"
              echo "vet: the GOOS=$goos build of ./cmd/gcpemu links github.com/Microsoft/go-winio; ADR 0015 restricts it to Windows builds" >&2
              exit 1
            }
          done
        silent: true
      - task: adr

  # #482: ADRs drafted on parallel branches can take the same number. The
  # sorted glob puts files sharing a prefix next to each other; list holds
  # all but the last of the current run, joined with commas. On Windows the
  # glob's paths use backslashes.
  adr:
    desc: Check that no two ADRs share a number
    silent: true
    cmds:
      - cmd: |
          flush() {
            [ "$n" -gt 1 ] || return 0
            echo "docs/adr: $prev is used by $list and $last" >&2
            status=1
          }
          prev= list= last= n=0 status=0
          for f in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            [ -e "$f" ] || continue
            name=${f##*/}
            name=${name##*\\}
            num=${name%%-*}
            if [ "$num" = "$prev" ]; then
              list=${list:+$list, }$last
              n=$((n + 1))
            else
              flush
              prev=$num list= n=1
            fi
            last=$name
          done
          flush
          exit $status

  # The whole e2e package, with no -run filter (#494), so no test is left out:
  # the SRS 11.2 Reference stack (container runtime + tofu; steps 2 and 4-8
  # download Helm, Istio charts and images: set GCPEMU_NET_TESTS=0 to skip them)
  # and the Containerized Instance tests, which build the OCI image (they need
  # the net and Docker too). Each test's own checks decide whether it runs.
  e2e:
    desc: Run the SRS 11.2 Reference stack and the Containerized Instance tests
    cmds:
      - GCPEMU_NET_TESTS=${GCPEMU_NET_TESTS:-1} go test -tags e2e ./e2e -count=1 -timeout 30m -v

  # SRS 7.1 client compatibility: gcloud, kubectl, Helm, Docker, crane, ko,
  # psql, the Cloud SQL Auth Proxy and dig against a detached instance.
  compat:
    desc: Run the SRS 7.1 client compatibility suite
    cmds:
      - go test -tags compat ./compat -skip TestOpenTofu -count=1 -timeout 30m -v

  # SRS 11.1 / IF-001 OpenTofu acceptance: every module in compat/tofu with
  # google and google-beta at the current and previous minor
  # (GCPEMU_TOFU_PROVIDERS narrows it, e.g. google-beta or google@8.6.0).
  tofu:
    desc: Run the SRS 11.1 OpenTofu acceptance tests
    cmds:
      - go test -tags compat ./compat -run TestOpenTofu -count=1 -timeout 35m -v

  # NFR-PORT-001: static builds for every supported OS/arch, with the real
  # Web console embedded.
  release:
    desc: Build the release binaries into dist/, with the Web console (VERSION=vX.Y.Z)
    deps: [console]
    preconditions:
      # The placeholder's marker is gone once the console is built
      # (console/embed.go); read and case are builtins, unlike grep.
      - sh: |
          while IFS= read -r line; do
            case $line in *'content="placeholder"'*) exit 1 ;; esac
          done < {{.CONSOLE_PLACEHOLDER}}
        msg: "release: the Web console bundle is not built"
    cmds:
      - defer: "{{.RESTORE_PLACEHOLDER}}"
        silent: true
      - task: cross

  # The release builds with whatever console/dist holds (Node-free CI).
  cross:
    desc: Build static binaries for every supported OS/arch into dist/
    cmds:
      - for: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64, windows/arm64]
        task: cross-platform
        vars:
          GOOS: '{{index (splitList "/" .ITEM) 0}}'
          GOARCH: '{{index (splitList "/" .ITEM) 1}}'

  cross-platform:
    internal: true
    silent: true
    env:
      CGO_ENABLED: "0"
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - echo "building {{.GOOS}}/{{.GOARCH}}"
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o dist/gcpemu-{{.GOOS}}-{{.GOARCH}}{{if eq .GOOS "windows"}}.exe{{end}} ./cmd/gcpemu

  # FR-CI-001/002: the setup-gcpemu GitHub Action; dist/ is committed (the
  # runner executes it as is), so rebuild and commit it with the sources.
  action:
    desc: Test and rebuild the setup-gcpemu action (commit its dist/)
    dir: setup-gcpemu
    cmds:
      - npm ci
      - npm test
      - npm run build
