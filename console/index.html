<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      ADR 0063: when a same-origin script of this page fails to load, as
      Chromium's net::ERR_NETWORK_CHANGED does to it, reload the page after
      1 s and then 2 s, at most twice per path; after that, say so in #root.
      When a same-origin stylesheet fails, the console may be running, so
      never reload: add a new <link> for it after 1 s and then 2 s; after
      that, say so outside #root. It is inline because a file of its own
      could fail the same way, and the Web console handler allows it by its
      hash. It must stay the only inline script.
    -->
    <script>
      ;(function () {
        var key = 'gcpemu.boot:' + location.pathname
        var bundleFailed = false
        var stylesheetAttempts = 0
        function whenParsed(show) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', show)
          } else show()
        }
        // Out of attempts, the page says so, and a reload by hand counts
        // from the start again.
        function giveUp() {
          try {
            sessionStorage.removeItem(key)
          } catch (err) {
            // Nothing was counted.
          }
          whenParsed(function () {
            var root = document.getElementById('root')
            if (root && !root.hasChildNodes()) {
              root.textContent =
                'The Web console couldn\u2019t load its files from the emulator. Reload to try again.'
            }
          })
        }
        function reloadAfter(ms) {
          setTimeout(function () {
            location.reload()
          }, ms)
        }
        function onBundleFailed() {
          var attempts
          try {
            attempts = Number(sessionStorage.getItem(key)) || 0
            if (attempts < 2) sessionStorage.setItem(key, String(attempts + 1))
          } catch (err) {
            // Without storage, a page that is itself a reload has had its one.
            var nav = performance.getEntriesByType('navigation')[0]
            if (nav && nav.type === 'reload') giveUp()
            else reloadAfter(1000)
            return
          }
          if (attempts >= 2) giveUp()
          else reloadAfter(1000 * Math.pow(2, attempts))
        }
        function onStylesheetFailed(link) {
          if (stylesheetAttempts >= 2) {
            // Outside #root, which belongs to a console that keeps running.
            whenParsed(function () {
              var notice = document.createElement('p')
              notice.setAttribute('role', 'alert')
              notice.textContent =
                'The Web console couldn\u2019t load its styles from the emulator. Reload to try again.'
              document.body.prepend(notice)
            })
            return
          }
          setTimeout(
            function () {
              link.replaceWith(link.cloneNode())
            },
            1000 * Math.pow(2, stylesheetAttempts),
          )
          stylesheetAttempts++
        }
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target
            var isStylesheet = el instanceof HTMLLinkElement && el.relList.contains('stylesheet')
            var url = el instanceof HTMLScriptElement ? el.src : isStylesheet ? el.href : ''
            if (!url || new URL(url, location.href).origin !== location.origin) return
            if (isStylesheet) onStylesheetFailed(el)
            else if (!bundleFailed) {
              bundleFailed = true
              onBundleFailed()
            }
          },
          true,
        )
        // A page whose bundle loaded has started, so the next failure on its
        // path counts from the start again.
        window.addEventListener('load', function () {
          if (bundleFailed) return
          try {
            sessionStorage.removeItem(key)
          } catch (err) {
            // Nothing was counted.
          }
        })
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/console/favicon.svg" />
    <title>gcpemu console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
