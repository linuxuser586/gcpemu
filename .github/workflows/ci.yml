name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Docs-only changes skip every job below rather than the whole workflow,
  # so ci-ok still reports and a docs-only PR can merge.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
      # #482: changes is the one job that runs on docs-only changes, where
      # ADRs land, so the ADR numbering check runs here.
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task adr

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      # #541: optional tools only warn, so this checks the script itself.
      - run: task doctor
      - run: task vet
      - run: task race
      - run: task cross

  # #340: the only writer of the Linux Go cache that every job restores.
  # On main it builds each variant the jobs compile (-exec true links the
  # test binaries without running them) and saves one entry per arch.
  # Nothing waits for it: when it fails, the cache is a commit older.
  go-cache:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # deletes the entries this one replaces
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        id: go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task vet
      - run: go test -exec true ./...
      - run: go test -exec true -race ./...
      - run: go test -exec true -tags e2e ./e2e
      - run: go test -exec true -tags compat ./compat
      - run: task cross
      - uses: ./.github/actions/go-cache-save
        with:
          paths: ${{ steps.go.outputs.paths }}
          prefix: ${{ steps.go.outputs.prefix }}

  # ADR 0005: the VM relay path, forced on Linux, where a container
  # runtime is available (hosted macOS runners have none). Cloud NAT's
  # container tests live in services/compute. docs/release.md has the
  # manual checks on real VM runtimes.
  vm-relay:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GCPEMU_VM_RELAY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go test -count=1 -timeout 45m ./internal/vmrelay ./internal/netplane ./services/sql ./services/compute ./services/nat ./services/lb ./services/gke
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-compat
          key: gcpemu-compat-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go') }}
      - name: gcloud container, kubectl and Helm (SRS 7.1)
        run: go test -tags compat ./compat -run 'TestClients/gcloud/container\+kubectl\+helm' -count=1 -timeout 15m -v

  # FR-UI-001/020: the Web console's lint, types, unit tests, build and
  # bundle budget, and admin API types generated from openapi.yaml.
  console:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Admin API types match openapi.yaml
        run: |
          pnpm gen:api
          git diff --exit-code src/api/admin.gen.ts || { echo "::error::console/src/api/admin.gen.ts is stale: run 'pnpm gen:api' in console/ and commit it"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size (FR-UI-020)
        run: pnpm check:size

  # FR-UI-023: Playwright on Chromium, Firefox and WebKit against a binary
  # with the real console. The runner's Docker backs the GKE view's clusters.
  console-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: console
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: console
      # The Instance removes its containers on exit, so record how they end.
      - run: docker events --filter type=container --filter event=die --filter event=oom --filter event=kill --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}} exit={{.Actor.Attributes.exitCode}}' > "$RUNNER_TEMP/container-events.log" &
      - run: task console-e2e
      - name: Container ends and OOM kills
        if: failure()
        run: |
          cat "$RUNNER_TEMP/container-events.log"
          sudo dmesg | grep -iE 'oom|killed process' || true
          free -m
      # #477: also upload when a test was flaky. Under retain-on-failure
      # Playwright keeps a trace only for an attempt that failed, so a trace
      # in a passing job means a test passed on retry.
      - uses: actions/upload-artifact@v7
        if: failure() || (success() && hashFiles('console/test-results/**/trace.zip') != '')
        with:
          name: playwright-report
          path: console/playwright-report

  # SRS 11.2: v1.0 is accepted when the Reference stack runs green on both
  # architectures within 10 minutes (the test enforces the budget). The same
  # task runs the Containerized Instance tests (#494).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GCPEMU_NET_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-e2e
          key: gcpemu-e2e-${{ runner.arch }}-${{ hashFiles('e2e/**') }}
          restore-keys: gcpemu-e2e-${{ runner.arch }}-
      - name: Reference stack (SRS 11.2) and Containerized Instance tests
        run: task e2e
      # #498: the release workflow's Image readiness check, run on every
      # change so it keeps working between releases, on an image built from
      # task cross output.
      - name: Image readiness check
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          task cross
          docker build --build-arg TARGETARCH=amd64 -t gcpemu:check -f Dockerfile dist
          task image-check IMAGE=gcpemu:check
      - name: Tests that need the internet
        run: go test -count=1 -timeout 30m ./services/gke ./services/ar -run 'TestImageCacheAcrossClusters|TestUpgrades|TestMirrorDockerHubNet'

  # SRS 7.1: real clients against a detached instance.
  compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-compat
          key: gcpemu-compat-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go') }}
      - name: Client compatibility (SRS 7.1)
        run: task compat

  # SRS 11.1 / IF-001: apply → plan (no diff) → destroy of every supported
  # resource type, with each provider at its current and previous minor.
  tofu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        provider: [google, google-beta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GCPEMU_TOFU_PROVIDERS: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      # actions/cache saves nothing after an exact key hit, so the week in
      # the key lets new provider releases and the version list reach it.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gcpemu-compat/tofu-plugins
            ~/.cache/gcpemu-compat/tofu-versions-*.json
          key: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-${{ hashFiles('compat/tofu/**', 'compat/tofu_test.go') }}-${{ steps.week.outputs.week }}
          restore-keys: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-
      - name: OpenTofu acceptance (SRS 11.1)
        run: task tofu

  # FR-CI-001/002: the setup-gcpemu action, with this commit's binary
  # served as release v0.0.0-selftest.
  action:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the post step reads the job's result
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests; dist/ matches the sources
        working-directory: setup-gcpemu
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code dist/ || { echo "::error::setup-gcpemu/dist is stale: run 'task action' and commit it"; exit 1; }
      - name: Serve this commit as a release
        run: |
          rel="$RUNNER_TEMP/rel/v0.0.0-selftest"
          mkdir -p "$rel"
          CGO_ENABLED=0 go build -trimpath -ldflags '-X github.com/linuxuser586/gcpemu/internal/instance.Version=v0.0.0-selftest' \
            -o "$rel/gcpemu-linux-$(go env GOARCH)" ./cmd/gcpemu
          (cd "$rel" && sha256sum gcpemu-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rel" >/dev/null 2>&1 &
      - uses: ./setup-gcpemu
        id: emu
        with:
          version: v0.0.0-selftest
          download-url: http://127.0.0.1:8765
          cache: false # #340: a new binary every commit can only miss
          services: gcs,pubsub,sql
          seed: setup-gcpemu/test/seed.yaml
          config: setup-gcpemu/test/gcpemu.yaml
          diagnostics: always
          artifact-name: gcpemu-selftest-${{ runner.arch }}
      - name: Environment, seed and config reach the instance
        run: setup-gcpemu/test/check.sh
        env:
          EXPECT_BIN: ${{ steps.emu.outputs.bin }}
      - name: Outputs
        run: |
          test "${{ steps.emu.outputs.version }}" = v0.0.0-selftest
          test -n "${{ steps.emu.outputs.gateway }}"
      # A second instance from a local binary. Its post step must find this
      # job successful and upload nothing (checked by action-artifacts).
      - uses: ./setup-gcpemu
        with:
          binary: ${{ steps.emu.outputs.bin }}
          instance: second
          cache: false
          services: pubsub
          artifact-name: gcpemu-selftest-second-${{ runner.arch }}
      - run: test "$GCPEMU_INSTANCE" = second && gcpemu status | grep -q 'instance second'

  action-artifacts:
    needs: action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gcpemu-selftest-*
          path: diag
      - name: Diagnostics of the first instance only
        run: |
          ls -R diag
          for arch in X64 ARM64; do
            d=diag/gcpemu-selftest-$arch
            for f in gcpemu.log requests.json resources.json containers.json info.json status.txt; do
              test -s "$d/$f" || { echo "::error::$d/$f is missing"; exit 1; }
            done
            ls "$d"/containers/*.log
            grep -q selftest-bucket "$d/resources.json"
            test ! -e "diag/gcpemu-selftest-second-$arch" || { echo "::error::a successful job uploaded diagnostics"; exit 1; }
          done

  # The Taskfile, scripts and tests on macOS and Windows. The tasks run
  # from pwsh (ADR 0018), so one that needs a POSIX tool fails here; the
  # other steps run in bash (Git Bash on Windows). Hosted macOS runners
  # have no container runtime and native Windows cannot use one (ADR 0008),
  # so tests that need one skip. On macOS, the setup-gcpemu action against
  # the in-process Services; on Windows, the Client compatibility suite
  # (SRS 7.1) for them.
  platforms:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # the action's post step reads the job's result; go-cache-save
      # deletes the entries it replaces
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # #340: the only job on these runners, so on main it saves the Go
      # cache it restores. Unpacking GOMODCACHE's many small files on
      # Windows costs more than downloading the modules.
      - uses: ./.github/actions/setup-go
        id: go
        with:
          modules: ${{ runner.os != 'Windows' }}
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task vet
        shell: pwsh
      - run: task build
        shell: pwsh
      - run: task cross
        shell: pwsh
      - run: .github/install-tofu.sh "$RUNNER_TEMP/tofu"
      - name: Tests
        run: go test ./...
      - uses: google-github-actions/setup-gcloud@v3
        if: runner.os == 'Windows'
      # os.UserCacheDir on Windows is %LocalAppData%.
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: ~/AppData/Local/gcpemu-compat
          key: gcpemu-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go') }}
      - name: Client compatibility (SRS 7.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: task compat
      - name: Serve this commit as a release
        if: runner.os == 'macOS'
        run: |
          rel="$RUNNER_TEMP/rel/v0.0.0-selftest"
          mkdir -p "$rel"
          CGO_ENABLED=0 go build -trimpath -ldflags '-X github.com/linuxuser586/gcpemu/internal/instance.Version=v0.0.0-selftest' \
            -o "$rel/gcpemu-darwin-$(go env GOARCH)" ./cmd/gcpemu
          (cd "$rel" && shasum -a 256 gcpemu-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rel" >/dev/null 2>&1 &
      - uses: ./setup-gcpemu
        if: runner.os == 'macOS'
        id: emu
        with:
          version: v0.0.0-selftest
          download-url: http://127.0.0.1:8765
          cache: false # #340: a new binary every commit can only miss
          services: gcs,pubsub
          seed: setup-gcpemu/test/seed-in-process.yaml
          config: setup-gcpemu/test/gcpemu.yaml
          artifact-name: gcpemu-macos-selftest-${{ runner.arch }}
      - name: Environment, seed and config reach the instance
        if: runner.os == 'macOS'
        run: setup-gcpemu/test/check.sh
        env:
          EXPECT_BIN: ${{ steps.emu.outputs.bin }}
          EXPECT_SQL: "0"
      - uses: ./.github/actions/go-cache-save
        if: github.event_name == 'push'
        with:
          paths: ${{ steps.go.outputs.paths }}
          prefix: ${{ steps.go.outputs.prefix }}

  # SRS 8.1 targets, asserted without the race detector; -p 1 keeps the
  # packages from competing for the CPU while they measure. ci-ok does not
  # need this job: a shared runner can miss a target without a regression
  # (ADR 0017), so a miss shows red here without blocking the merge.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GCPEMU_PERF_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # SRS 8.1 measures with images pre-cached.
      - name: Pre-pull images
        run: |
          for i in postgres:17.10-alpine rancher/k3s:v1.36.5-k3s1 rancher/mirrored-pause:3.10.2 rancher/mirrored-coredns-coredns:1.14.7 \
                   rancher/local-path-provisioner:v0.0.37 rancher/mirrored-library-busybox:1.37.0 rancher/klipper-lb:v0.4.17; do
            docker pull -q "$i"
          done
      - name: Performance targets
        run: >-
          go test -p 1 -count=1 -timeout 25m -v
          ./cmd/gcpemu ./services/gcs ./services/pubsub ./services/lb ./services/cdn ./services/sql ./services/gke
          -run 'TestColdStartAndIdleRSS|TestControlPlaneP99|TestBinarySize|TestThroughputTarget|TestPublishPullTarget|TestPerformanceTargets|TestHitLatencyP99|TestInstanceLifecycle|TestGKE$'

  # The only required check: the matrix legs above report unexpanded names
  # when skipped, so the ruleset requires this job instead. It passes when
  # every job it needs ran green, or when the change touched docs alone and
  # every job was skipped. perf is left out on purpose (see its comment).
  ci-ok:
    if: always()
    needs: [changes, test, vm-relay, console, console-e2e, e2e, compat, tofu, action, action-artifacts, platforms]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          changes=$(jq -r .changes.result <<<"$NEEDS")
          test "$changes" = success || { echo "::error::changes: $changes"; exit 1; }
          want=skipped
          test "$(jq -r .changes.outputs.code <<<"$NEEDS")" = true && want=success
          bad=$(jq -r --arg want "$want" 'del(.changes) | to_entries[] | select(.value.result != $want) | "\(.key): \(.value.result)"' <<<"$NEEDS")
          test -z "$bad" || { echo "::error::want every job $want, got:"; echo "$bad"; exit 1; }
