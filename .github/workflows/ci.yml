name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make race
      - run: make release

  # SRS 11.2: v1.0 is accepted when the reference stack runs green on both
  # architectures within 10 minutes (the test enforces the budget).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GCPEMU_NET_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gcpemu-e2e
          key: gcpemu-e2e-${{ runner.arch }}-${{ hashFiles('e2e/**') }}
          restore-keys: gcpemu-e2e-${{ runner.arch }}-
      - name: Reference stack (SRS 11.2)
        run: make e2e
      - name: Tests that need the internet
        run: go test -count=1 -timeout 30m ./services/gke ./services/ar -run 'TestImageCacheAcrossClusters|TestUpgrades|TestMirrorDockerHubNet'

  # SRS 7.1: real clients against a detached instance.
  compat:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gcpemu-compat
          key: gcpemu-compat-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go') }}
      - name: Client compatibility (SRS 7.1)
        run: make compat

  # SRS 11.1 / IF-001: apply → plan (no diff) → destroy of every supported
  # resource type, with each provider at its current and previous minor.
  tofu:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        provider: [google, google-beta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GCPEMU_TOFU_PROVIDERS: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gcpemu-compat/tofu-plugins
          key: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-${{ hashFiles('compat/tofu/**') }}
          restore-keys: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-
      - name: OpenTofu acceptance (SRS 11.1)
        run: make tofu

  # FR-CI-001/002: the setup-gcpemu action, with this commit's binary
  # served as release v0.0.0-selftest.
  action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the post step reads the job's result
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests; dist/ matches the sources
        working-directory: setup-gcpemu
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code dist/ || { echo "::error::setup-gcpemu/dist is stale: run 'make action' and commit it"; exit 1; }
      - name: Serve this commit as a release
        run: |
          rel="$RUNNER_TEMP/rel/v0.0.0-selftest"
          mkdir -p "$rel"
          CGO_ENABLED=0 go build -trimpath -ldflags '-X github.com/linuxuser586/gcpemu/internal/instance.Version=v0.0.0-selftest' \
            -o "$rel/gcpemu-linux-$(go env GOARCH)" ./cmd/gcpemu
          (cd "$rel" && sha256sum gcpemu-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rel" >/dev/null 2>&1 &
      - uses: ./setup-gcpemu
        id: emu
        with:
          version: v0.0.0-selftest
          download-url: http://127.0.0.1:8765
          services: gcs,pubsub,sql
          seed: setup-gcpemu/test/seed.yaml
          config: setup-gcpemu/test/gcpemu.yaml
          diagnostics: always
          artifact-name: gcpemu-selftest-${{ runner.arch }}
      - name: Environment, seed and config reach the instance
        run: setup-gcpemu/test/check.sh
        env:
          EXPECT_BIN: ${{ steps.emu.outputs.bin }}
      - name: Outputs
        run: |
          test "${{ steps.emu.outputs.version }}" = v0.0.0-selftest
          test -n "${{ steps.emu.outputs.gateway }}"
      # A second instance from a local binary. Its post step must find this
      # job successful and upload nothing (checked by action-artifacts).
      - uses: ./setup-gcpemu
        with:
          binary: ${{ steps.emu.outputs.bin }}
          instance: second
          services: pubsub
          artifact-name: gcpemu-selftest-second-${{ runner.arch }}
      - run: test "$GCPEMU_INSTANCE" = second && gcpemu status | grep -q 'instance second'

  action-artifacts:
    needs: action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gcpemu-selftest-*
          path: diag
      - name: Diagnostics of the first instance only
        run: |
          ls -R diag
          for arch in X64 ARM64; do
            d=diag/gcpemu-selftest-$arch
            for f in gcpemu.log requests.json resources.json containers.json info.json status.txt; do
              test -s "$d/$f" || { echo "::error::$d/$f is missing"; exit 1; }
            done
            ls "$d"/containers/*.log
            grep -q selftest-bucket "$d/resources.json"
            test ! -e "diag/gcpemu-selftest-second-$arch" || { echo "::error::a successful job uploaded diagnostics"; exit 1; }
          done

  # SRS 8.1 targets, asserted without the race detector; -p 1 keeps the
  # packages from competing for the CPU while they measure.
  perf:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GCPEMU_PERF_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # SRS 8.1 measures with images pre-cached.
      - name: Pre-pull images
        run: |
          for i in postgres:17.10-alpine rancher/k3s:v1.36.5-k3s1 rancher/mirrored-pause:3.10.2 rancher/mirrored-coredns-coredns:1.14.7 \
                   rancher/local-path-provisioner:v0.0.37 rancher/mirrored-library-busybox:1.37.0 rancher/klipper-lb:v0.4.17; do
            docker pull -q "$i"
          done
      - name: Performance targets
        run: >-
          go test -p 1 -count=1 -timeout 25m -v
          ./cmd/gcpemu ./services/gcs ./services/pubsub ./services/lb ./services/cdn ./services/sql ./services/gke
          -run 'TestColdStartAndIdleRSS|TestControlPlaneP99|TestBinarySize|TestThroughputTarget|TestPublishPullTarget|TestPerformanceTargets|TestHitLatencyP99|TestInstanceLifecycle|TestGKE$'
