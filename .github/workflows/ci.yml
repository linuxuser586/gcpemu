name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Docs-only changes skip every job below except adr rather than the whole
  # workflow, so ci-ok still reports and a docs-only PR can merge.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  # #482, #766: the ADR numbering check runs on every change, docs-only
  # ones included, where ADRs land. Its own job, so a clash fails here
  # alone and the test jobs still run.
  adr:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task adr

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      # #541: optional tools only warn, so this checks the script itself.
      - run: task doctor
      - run: task vet
      - run: task race
      - run: task cross

  # #340: the only writer of the Linux Go cache that every job restores.
  # On main it builds each variant the jobs compile (-exec true links the
  # test binaries without running them) and saves one entry per arch.
  # Nothing waits for it: when it fails, the cache is a commit older.
  go-cache:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # deletes the entries this one replaces
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        id: go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task vet
      - run: go test -exec true ./...
      - run: go test -exec true -race ./...
      - run: go test -exec true -tags e2e ./e2e
      - run: go test -exec true -tags compat ./compat
      - run: task cross
      - uses: ./.github/actions/go-cache-save
        with:
          paths: ${{ steps.go.outputs.paths }}
          prefix: ${{ steps.go.outputs.prefix }}

  # ADR 0005: the VM relay path, forced on Linux, where a container
  # runtime is available (hosted macOS runners have none). Cloud NAT's
  # container tests live in services/compute. docs/release.md has the
  # manual checks on real VM runtimes.
  vm-relay:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # #900: on Ubuntu 26.04 runners the Ingress data path never reaches the
    # GKE pod (TestGKEIngressAndGateway). Move to ubuntu-26.04 with its fix.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GCPEMU_VM_RELAY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go test -count=1 -timeout 45m ./internal/vmrelay ./internal/netplane ./services/build ./services/sql ./services/compute ./services/nat ./services/lb ./services/gke
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-compat
          key: gcpemu-compat-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go', 'compat/universe_test.go') }}
      - name: gcloud container, kubectl, Helm and builds (SRS 7.1)
        run: go test -tags compat ./compat -run 'TestClients/gcloud/(container\+kubectl\+helm|builds)' -count=1 -timeout 25m -v

  # FR-UI-001/020: the Web console's lint, types, unit tests, build and
  # bundle budget, and admin API types generated from openapi.yaml.
  console:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Admin API types match openapi.yaml
        run: |
          pnpm gen:api
          git diff --exit-code src/api/admin.gen.ts || { echo "::error::console/src/api/admin.gen.ts is stale: run 'pnpm gen:api' in console/ and commit it"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size (FR-UI-020)
        run: pnpm check:size

  # FR-UI-023: Playwright on Chromium, Firefox and WebKit against a binary
  # with the real console. The runner's Docker backs the GKE view's clusters.
  # #817: a healthy run takes 14-15 minutes, 12.5 of them in the suite, so 30
  # is about twice that.
  console-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: console
      # #817: --with-deps fetches Firefox's and WebKit's system packages from
      # the Ubuntu mirror, which sometimes crawls at ~50 KB/s. The browsers and
      # those .debs are cached per runner image and Playwright version, so a
      # hit only refreshes apt's indexes. ImageOS is a runner variable, not in
      # the env context, hence the shell.
      - id: playwright-key
        run: echo "key=playwright-$RUNNER_OS-$ImageOS-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: console
      - id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.playwright-key.outputs.key }}
      - name: Install Playwright browsers and their system packages
        timeout-minutes: 12
        working-directory: console
        run: |
          debs=~/.cache/playwright-debs
          mkdir -p "$debs"
          # apt-get skips a package already in its archive directory.
          sudo cp "$debs"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          for attempt in 1 2; do
            if timeout 5m pnpm exec playwright install --with-deps chromium firefox webkit; then
              cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt failed or took over 5 minutes"
          done
          exit 1
      # Saved straight away, so a failing suite still keeps the cache.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.playwright-key.outputs.key }}
      # The Instance removes its containers on exit, so record how they end.
      - run: docker events --filter type=container --filter event=die --filter event=oom --filter event=kill --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}} exit={{.Actor.Attributes.exitCode}}' > "$RUNNER_TEMP/container-events.log" &
      - run: task console-e2e
      - name: Container ends and OOM kills
        if: failure()
        run: |
          cat "$RUNNER_TEMP/container-events.log"
          sudo dmesg | grep -iE 'oom|killed process' || true
          free -m
      # #477: also upload when a test was flaky. Under retain-on-failure
      # Playwright keeps a trace only for an attempt that failed, so a trace
      # in a passing job means a test passed on retry.
      - uses: actions/upload-artifact@v7
        if: failure() || (success() && hashFiles('console/test-results/**/trace.zip') != '')
        with:
          name: playwright-report
          path: console/playwright-report

  # SRS 11.2: v1.0 is accepted when the Reference stack runs green on both
  # architectures within 10 minutes (the test enforces the budget). The same
  # task runs the Containerized Instance tests (#494).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GCPEMU_NET_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-e2e
          key: gcpemu-e2e-${{ runner.arch }}-${{ hashFiles('e2e/**') }}
          restore-keys: gcpemu-e2e-${{ runner.arch }}-
      - name: Reference stack (SRS 11.2) and Containerized Instance tests
        run: task e2e
      # #498, #630: the release workflow's Image readiness check, run on
      # every change so it keeps working between releases. Each runner
      # checks its own platform's image, built from task cross output.
      - name: Image readiness check
        run: |
          task cross
          docker build --build-arg TARGETARCH="$(go env GOARCH)" -t gcpemu:check -f Dockerfile dist
          task image-check IMAGE=gcpemu:check
      # #862: the release workflow's echo-image-check, likewise.
      - name: Echo image check
        run: |
          task echo:dist
          docker build --build-arg TARGETARCH="$(go env GOARCH)" -t gcpemu-echo:check -f cmd/gcpemu-echo/Dockerfile dist-echo
          task echo:image-check IMAGE=gcpemu-echo:check
      - name: Tests that need the internet
        run: go test -count=1 -timeout 30m ./services/gke ./services/ar -run 'TestImageCacheAcrossClusters|TestUpgrades|TestMirrorDockerHubNet'

  # SRS 11.4: v1.0 is accepted when an Autopilot cluster from OpenTofu passes
  # Kubernetes conformance at each supported minor, scales a Deployment past
  # one node and refuses a privileged pod, on both architectures.
  autopilot:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-e2e
          key: gcpemu-e2e-autopilot-${{ runner.arch }}-${{ hashFiles('e2e/**') }}
          restore-keys: gcpemu-e2e-autopilot-${{ runner.arch }}-
      - name: Autopilot acceptance (SRS 11.4)
        run: task autopilot

  # SRS 7.1: real clients against a detached instance.
  compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      # ADR 0025: the IF-007/IF-008 clients run from host toolchains.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # #766: the Linux arm64 SDK bundles no Python, so gcloud runs on this
      # one, and sign-url needs its cryptography library.
      - name: cryptography for gcloud on arm64
        if: runner.arch == 'ARM64'
        run: |
          python -m pip install -q cryptography
          echo "CLOUDSDK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "CLOUDSDK_PYTHON_SITEPACKAGES=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Not setup-java's cache: it fails while no pom.xml exists.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.arch }}-${{ hashFiles('compat/**/pom.xml') }}
          restore-keys: m2-${{ runner.arch }}-
      # Maven and the aws CLI v2 from the runner image, where it has them.
      - name: Maven and the aws CLI
        run: |
          command -v mvn >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq maven; }
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install"
          fi
          python3 --version; node --version; java -version; mvn --version; aws --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gcpemu-compat
          key: gcpemu-compat-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go', 'compat/universe_test.go') }}
      # A missing client fails its test here instead of skipping it.
      - name: Client compatibility (SRS 7.1)
        env:
          GCPEMU_COMPAT_REQUIRE: "1"
        run: task compat
      # #611: gcpemu dns install through systemd-resolved, with the
      # runner's passwordless sudo. The Pre-release host checks run it on
      # macOS and Windows.
      - name: Resolver routes
        if: matrix.runner == 'ubuntu-26.04'
        env:
          GCPEMU_RESOLVER_TESTS: "1"
        run: |
          task build
          go test -tags prerelease ./prerelease -run '^(TestResolverRoutes|TestAddresses|TestRoutesOwner)$' -count=1 -timeout 15m -v

  # SRS 11.1 / IF-001: apply → plan (no diff) → destroy of every supported
  # resource type, with each provider at its current and previous minor.
  tofu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        provider: [google, google-beta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GCPEMU_TOFU_PROVIDERS: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Install OpenTofu
        run: .github/install-tofu.sh
      # actions/cache saves nothing after an exact key hit, so the week in
      # the key lets new provider releases and the version list reach it.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gcpemu-compat/tofu-plugins
            ~/.cache/gcpemu-compat/tofu-versions-*.json
          key: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-${{ hashFiles('compat/tofu/**', 'compat/tofu_test.go') }}-${{ steps.week.outputs.week }}
          restore-keys: gcpemu-tofu-${{ runner.arch }}-${{ matrix.provider }}-
      - name: OpenTofu acceptance (SRS 11.1)
        run: task tofu

  # SRS 11.1 Kubernetes conformance: Sonobuoy quick mode on a Standard
  # cluster at each supported minor's newest patch.
  kube-conformance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Kubernetes conformance (SRS 11.1)
        env:
          GCPEMU_COMPAT_REQUIRE: "1"
        run: task kube-conformance
      - name: Sonobuoy results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kube-conformance-${{ matrix.runner }}
          path: compat/kube-conformance-results/
          if-no-files-found: ignore

  # SRS 11.1 / ADR 0023: the emulator against the committed Recordings,
  # with no credentials.
  conformance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Conformance suite (SRS 11.1)
        run: task conformance

  # FR-CI-001/002: the setup-gcpemu action, with this commit's binary
  # served as release v0.0.0-selftest.
  action:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the post step reads the job's result
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # The action runs on the node24 runtime (action.yml); test on the same.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests; dist/ matches the sources
        working-directory: setup-gcpemu
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code dist/ || { echo "::error::setup-gcpemu/dist is stale: run 'task action' and commit it"; exit 1; }
      - name: Serve this commit as a release
        run: |
          rel="$RUNNER_TEMP/rel/v0.0.0-selftest"
          mkdir -p "$rel"
          CGO_ENABLED=0 go build -trimpath -ldflags '-X github.com/linuxuser586/gcpemu/internal/instance.Version=v0.0.0-selftest' \
            -o "$rel/gcpemu-linux-$(go env GOARCH)" ./cmd/gcpemu
          (cd "$rel" && sha256sum gcpemu-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rel" >/dev/null 2>&1 &
      - uses: ./setup-gcpemu
        id: emu
        with:
          version: v0.0.0-selftest
          download-url: http://127.0.0.1:8765
          verify-signature: false # the local mirror has no Sigstore bundle
          cache: false # #340: a new binary every commit can only miss
          services: gcs,pubsub,sql
          seed: setup-gcpemu/test/seed.yaml
          config: setup-gcpemu/test/gcpemu.yaml
          diagnostics: always
          artifact-name: gcpemu-selftest-${{ runner.arch }}
      - name: Environment, seed and config reach the instance
        run: setup-gcpemu/test/check.sh
        env:
          EXPECT_BIN: ${{ steps.emu.outputs.bin }}
      - name: Outputs
        run: |
          test "${{ steps.emu.outputs.version }}" = v0.0.0-selftest
          test -n "${{ steps.emu.outputs.gateway }}"
      # A second instance from a local binary. Its post step must find this
      # job successful and upload nothing (checked by action-artifacts).
      - uses: ./setup-gcpemu
        with:
          binary: ${{ steps.emu.outputs.bin }}
          instance: second
          cache: false
          services: pubsub
          artifact-name: gcpemu-selftest-second-${{ runner.arch }}
      - run: test "$GCPEMU_INSTANCE" = second && gcpemu status | grep -q 'instance second'
      # NFR-SEC-005: the action from this checkout against the real latest
      # release, with signature verification on. Until the first Signed
      # release ships this takes the "unsigned release" warning branch.
      - uses: ./setup-gcpemu
        id: release
        with:
          version: latest
          instance: release
          services: pubsub
          artifact-name: gcpemu-selftest-release-${{ runner.arch }}
      - run: test -n "${{ steps.release.outputs.version }}" && test "$GCPEMU_INSTANCE" = release

  action-artifacts:
    needs: action
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gcpemu-selftest-*
          path: diag
      - name: Diagnostics of the first instance only
        run: |
          ls -R diag
          for arch in X64 ARM64; do
            d=diag/gcpemu-selftest-$arch
            for f in gcpemu.log requests.json resources.json containers.json info.json status.txt; do
              test -s "$d/$f" || { echo "::error::$d/$f is missing"; exit 1; }
            done
            ls "$d"/containers/*.log
            grep -q selftest-bucket "$d/resources.json"
            test ! -e "diag/gcpemu-selftest-second-$arch" || { echo "::error::a successful job uploaded diagnostics"; exit 1; }
          done

  # The Taskfile, scripts and tests on macOS and Windows. The tasks run
  # from pwsh (ADR 0018), so one that needs a POSIX tool fails here; the
  # other steps run in bash (Git Bash on Windows). Hosted macOS runners
  # have no container runtime and native Windows cannot use one (ADR 0008),
  # so tests that need one skip. On macOS, the setup-gcpemu action against
  # the in-process Services; on Windows, the Client compatibility suite
  # (SRS 7.1) for them.
  platforms:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # the action's post step reads the job's result; go-cache-save
      # deletes the entries it replaces
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # #340: the only job on these runners, so on main it saves the Go
      # cache it restores. Unpacking GOMODCACHE's many small files on
      # Windows costs more than downloading the modules.
      - uses: ./.github/actions/setup-go
        id: go
        with:
          modules: ${{ runner.os != 'Windows' }}
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task vet
        shell: pwsh
      - run: task build
        shell: pwsh
      - run: task cross
        shell: pwsh
      - run: .github/install-tofu.sh "$RUNNER_TEMP/tofu"
      - name: Tests
        run: go test ./...
      - uses: google-github-actions/setup-gcloud@v3
        if: runner.os == 'Windows'
      # #766: the Windows SDK bundles no Python either. Without one on
      # PATH, gcloud prints the Microsoft Store alias's notice into its
      # output; sign-url needs cryptography; the Java probe needs 21.
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.15"
      - name: cryptography for gcloud on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install -q cryptography
          echo "CLOUDSDK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "CLOUDSDK_PYTHON_SITEPACKAGES=1" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        if: runner.os == 'Windows'
        with:
          distribution: temurin
          java-version: 21
      # os.UserCacheDir on Windows is %LocalAppData%.
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: ~/AppData/Local/gcpemu-compat
          key: gcpemu-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compat/tools_test.go', 'compat/universe_test.go') }}
      - name: Client compatibility (SRS 7.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: task compat
      - name: Serve this commit as a release
        if: runner.os == 'macOS'
        run: |
          rel="$RUNNER_TEMP/rel/v0.0.0-selftest"
          mkdir -p "$rel"
          CGO_ENABLED=0 go build -trimpath -ldflags '-X github.com/linuxuser586/gcpemu/internal/instance.Version=v0.0.0-selftest' \
            -o "$rel/gcpemu-darwin-$(go env GOARCH)" ./cmd/gcpemu
          (cd "$rel" && shasum -a 256 gcpemu-* > SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rel" >/dev/null 2>&1 &
      - uses: ./setup-gcpemu
        if: runner.os == 'macOS'
        id: emu
        with:
          version: v0.0.0-selftest
          download-url: http://127.0.0.1:8765
          verify-signature: false # the local mirror has no Sigstore bundle
          cache: false # #340: a new binary every commit can only miss
          services: gcs,pubsub
          seed: setup-gcpemu/test/seed-in-process.yaml
          config: setup-gcpemu/test/gcpemu.yaml
          artifact-name: gcpemu-macos-selftest-${{ runner.arch }}
      - name: Environment, seed and config reach the instance
        if: runner.os == 'macOS'
        run: setup-gcpemu/test/check.sh
        env:
          EXPECT_BIN: ${{ steps.emu.outputs.bin }}
          EXPECT_SQL: "0"
      - uses: ./.github/actions/go-cache-save
        if: github.event_name == 'push'
        with:
          paths: ${{ steps.go.outputs.paths }}
          prefix: ${{ steps.go.outputs.prefix }}

  # SRS 8.1 targets, asserted without the race detector; -p 1 keeps the
  # packages from competing for the CPU while they measure. ci-ok does not
  # need this job: a shared runner can miss a target without a regression
  # (ADR 0017), so a miss shows red here without blocking the merge.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GCPEMU_PERF_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # SRS 8.1 measures with images pre-cached.
      - name: Pre-pull images
        run: |
          for i in postgres:17.10-alpine rancher/k3s:v1.36.5-k3s1 rancher/mirrored-pause:3.10.2 rancher/mirrored-coredns-coredns:1.14.7 \
                   rancher/local-path-provisioner:v0.0.37 rancher/mirrored-library-busybox:1.37.0 rancher/klipper-lb:v0.4.17 \
                   rancher/mirrored-metrics-server:v0.9.0; do
            docker pull -q "$i"
          done
      - name: Performance targets
        run: >-
          go test -p 1 -count=1 -timeout 25m -v
          ./cmd/gcpemu ./services/gcs ./services/pubsub ./services/lb ./services/cdn ./services/sql ./services/gke
          -run 'TestColdStartAndIdleRSS|TestControlPlaneP99|TestBinarySize|TestThroughputTarget|TestPublishPullTarget|TestPerformanceTargets|TestHitLatencyP99|TestInstanceLifecycle|TestGKE$'

  # The only required check: the matrix legs above report unexpanded names
  # when skipped, so the ruleset requires this job instead. It passes when
  # every job it needs ran green, or when the change touched docs alone and
  # every job but adr was skipped. perf is left out on purpose (see its
  # comment).
  ci-ok:
    if: always()
    needs: [changes, adr, test, vm-relay, console, console-e2e, e2e, autopilot, compat, tofu, kube-conformance, conformance, action, action-artifacts, platforms]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # The jobs that run on every change.
          always='["changes", "adr"]'
          bad=$(jq -r --argjson always "$always" 'to_entries[] | select(.key | IN($always[])) | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          test -z "$bad" || { echo "::error::$bad"; exit 1; }
          want=skipped
          test "$(jq -r .changes.outputs.code <<<"$NEEDS")" = true && want=success
          bad=$(jq -r --arg want "$want" --argjson always "$always" 'to_entries[] | select(.key | IN($always[]) | not) | select(.value.result != $want) | "\(.key): \(.value.result)"' <<<"$NEEDS")
          test -z "$bad" || { echo "::error::want every job $want, got:"; echo "$bad"; exit 1; }
