name: scan
# #1165, ADR 0090: the weekly scans of main, each keeping one rolling
# issue (.github/rolling-issue.sh) open while it has something to report
# and closing it on the first run that has nothing.
#
# govulncheck fails the run, as it does on a pull request that changes
# go.mod or go.sum. The image report, of Product, Helper and Release
# images, only reports: refreshing a Product image is a deliberate change
# (#895), a Helper image moves with Renovate, and the release gates its own
# images, so a finding never fails CI. Its issue also lists stale
# .trivyignore.yaml vulnerabilities entries (#1205) and the scan
# exceptions that stop holding within two weeks, since an expired one fails
# every PR's scans.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

env:
  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - id: vulncheck
        run: |
          set -o pipefail
          just vulncheck 2>&1 | tee "$RUNNER_TEMP/vulncheck.txt"
      # Only main's results belong in the issue: a dispatch from a
      # branch (e.g. to try a change to this workflow) reports in its
      # job summary alone.
      - name: Rolling issue
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.vulncheck.outcome }}
        run: |
          title="Go vulnerabilities called on main"
          if [ "$OUTCOME" = success ]; then
            .github/rolling-issue.sh close "$title"
          elif [ -s "$RUNNER_TEMP/vulncheck.txt" ]; then
            {
              echo "The weekly govulncheck ($RUN) failed on main. Fix each finding, or add a scan exception to \`.govulncheck-allow.json\` (ADR 0090)."
              echo
              echo '```'
              tail -c 60000 "$RUNNER_TEMP/vulncheck.txt"
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            .github/rolling-issue.sh open "$title" "$RUNNER_TEMP/body.md"
          fi

  images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/trivy
      # #1205: the Release images, built from main for this runner's
      # architecture as CI's e2e job builds them, so the report judges
      # .trivyignore.yaml's vulnerabilities entries against every image.
      # A failed build must not hide the other images' findings: the
      # report then counts the missing image as a failed scan, skips the
      # stale judgment and fails the run.
      - name: Build Release images
        continue-on-error: true
        run: |
          just cross-host
          docker build --build-arg TARGETARCH="$(go env GOARCH)" -t gcpemu:check -f Dockerfile dist
          just echo-dist
          docker build --build-arg TARGETARCH="$(go env GOARCH)" -t gcpemu-echo:check -f cmd/gcpemu-echo/Dockerfile dist-echo
      # Fails only when an image could not be scanned, after reporting the
      # others.
      - id: scan
        name: Scan images
        run: just image-report -release gcpemu:check,gcpemu-echo:check -issue "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
      # Closed only after a run that scanned every Product, Helper and
      # Release image and found nothing to report, so a partial scan is
      # never an all-clear. Only main's results belong in the issue: a
      # dispatch from a branch (e.g. to try a change to this workflow)
      # reports in its job summary alone.
      - name: Rolling issue
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          title="Weekly scan: image findings and expiring scan exceptions"
          if [ -s "$RUNNER_TEMP/issue.md" ]; then
            {
              echo "The weekly image scan ($RUN) found these. CI never fails on them (ADR 0090): triage each into an issue, a Product image refresh (#895), or, for a Helper image, a Renovate bump or an upstream report; delete each stale scan exception. Each weekly scan that finds any updates this issue."
              cat "$RUNNER_TEMP/issue.md"
            } > "$RUNNER_TEMP/body.md"
            .github/rolling-issue.sh open "$title" "$RUNNER_TEMP/body.md"
          elif [ "$OUTCOME" = success ]; then
            .github/rolling-issue.sh close "$title"
          fi
