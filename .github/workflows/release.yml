name: release
# A vX.Y.Z tag publishes the static binaries and SHA256SUMS that
# setup-gcpemu downloads and verifies (FR-CI-001), and moves the major tag
# (vX) that `uses: linuxuser586/gcpemu/setup-gcpemu@vX` resolves. The image
# job then publishes the same linux binaries as the OCI image (NFR-PORT-004),
# once image-check has run each platform's image natively (#498, #630).
# The release and image jobs sign what they publish with keyless cosign,
# and the binaries get an SBOM each and SLSA provenance (NFR-SEC-005);
# docs/release.md shows how to verify them. Run the manual macOS checks in
# docs/release.md before pushing the tag.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      # FR-UI-001: `task release` embeds the Web console and fails if it
      # is not built.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build
        run: |
          task release VERSION="$GITHUB_REF_NAME"
          cd dist && sha256sum gcpemu-* > SHA256SUMS && cat SHA256SUMS
      # NFR-SEC-005. Everything below runs before Publish, so a failure
      # publishes nothing. The SBOMs stay out of dist, so the dist/gcpemu-*
      # globs still match only the binaries.
      - id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir sbom
          for bin in dist/gcpemu-*; do
            name="$(basename "$bin" .exe)"
            "$SYFT" scan "file:$bin" -o "spdx-json=sbom/$name.spdx.json"
          done
      # cosign-installer publishes no major tag (v4), only full versions.
      - uses: sigstore/cosign-installer@v4.1.2
      # Only SHA256SUMS is signed: it covers each binary through its hash.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/gcpemu-*
      # One per binary: keep these in step with the platforms in the
      # Taskfile's cross task.
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-linux-amd64
          sbom-path: sbom/gcpemu-linux-amd64.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-linux-arm64
          sbom-path: sbom/gcpemu-linux-arm64.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-darwin-amd64
          sbom-path: sbom/gcpemu-darwin-amd64.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-darwin-arm64
          sbom-path: sbom/gcpemu-darwin-arm64.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-windows-amd64.exe
          sbom-path: sbom/gcpemu-windows-amd64.spdx.json
      - uses: actions/attest@v4
        with:
          subject-path: dist/gcpemu-windows-arm64.exe
          sbom-path: sbom/gcpemu-windows-arm64.spdx.json
      # docs/releases/vX.Y.Z.md, when present, goes above the generated
      # list of pull requests.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] && flags+=(--notes-file "$notes")
          gh release create "$GITHUB_REF_NAME" dist/gcpemu-* dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json sbom/*.spdx.json --verify-tag --generate-notes "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: dist/gcpemu-linux-*
          if-no-files-found: error
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f origin "refs/tags/$major"

  # #498, #630: the Image readiness check. Each platform's image, built on
  # a runner of its own architecture from the same dist binaries and
  # Dockerfile as the image job's push, must report ready before any tag is
  # pushed. A failure on either leaves the GitHub release published without
  # an image (docs/release.md).
  image-check:
    needs: release
    strategy:
      # Each leg reports on its own; the image job runs only if both pass.
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist
      - uses: docker/setup-buildx-action@v4
      # No platforms: buildx builds for the runner's own.
      - uses: docker/build-push-action@v7
        with:
          context: dist
          file: Dockerfile
          load: true
          tags: gcpemu:check
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Image readiness check
        run: task image-check IMAGE=gcpemu:check

  # A separate job, so a registry outage never holds up the binaries that
  # setup-gcpemu downloads, and it can be re-run on its own. It rebuilds
  # both platforms rather than reusing image-check's builds: the Dockerfile
  # only copies files.
  image:
    needs: image-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # vX.Y.Z pushes X.Y.Z, X.Y, X and latest; a prerelease only its
      # exact version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/linuxuser586/gcpemu
            ghcr.io/linuxuser586/gcpemu
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      # NFR-SEC-005: sign the manifest list by digest, never by tag, in each
      # registry. A failure leaves the pushed tags unsigned until the job
      # is re-run, which pushes the tags again and signs the digest they
      # then name (docs/release.md).
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "docker.io/linuxuser586/gcpemu@$DIGEST"
          cosign sign --yes "ghcr.io/linuxuser586/gcpemu@$DIGEST"
