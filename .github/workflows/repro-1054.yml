name: repro-1054
# THROWAWAY, removed before merge. Checks that a cache hit installs with
# the Ubuntu archive blackholed, so it never contacts the archive (#1054).
# warm needs the real archive; while it is down, warm fails and hit skips.
on:
  push:
    branches: [fix/1054-playwright-archive-outage]

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: console
      - uses: ./.github/actions/playwright
        timeout-minutes: 12
        with:
          key-prefix: repro-hit-${{ github.run_id }}-${{ github.run_attempt }}

  hit:
    needs: warm
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: console
      # A blackholed host fails apt within minutes (#1054), so a hit that
      # contacted the archive would fail or run long.
      - name: Blackhole the Ubuntu archive
        run: |
          echo "192.0.2.1 azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
      - id: install
        uses: ./.github/actions/playwright
        timeout-minutes: 12
        with:
          key-prefix: repro-hit-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the outcome
        run: |
          elapsed=$(( $(date +%s) - start ))
          echo "hit: installed in ${elapsed}s with the archive blackholed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$elapsed" -lt 180 ]
      # The browsers launch, so dpkg installed every system package they need.
      - name: Launch each browser
        working-directory: console
        run: |
          node -e "
            const pw = require('@playwright/test');
            (async () => {
              for (const name of ['chromium', 'firefox', 'webkit']) {
                await (await pw[name].launch()).close();
                console.log(name + ' launched');
              }
            })().catch(e => { console.error(e); process.exit(1) });"
